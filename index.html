<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歯科国試クイズリーダー</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .quiz-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { color: #2c3e50; font-size: 1.2rem; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .question { font-weight: bold; margin: 20px 0; }
        .option { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; text-align: left; background: white; transition: 0.2s; }
        .option:hover { background: #e1f5fe; border-color: #3498db; }
        #result { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div class="quiz-card">
        <h1>🦷 歯科国試 練習問題</h1>
        <div id="quiz-area">
            <div class="question" id="q-text">問題：歯科用アマルガムの成分で最も含有量が多いのはどれか。</div>
            <button class="option" onclick="check(false)">銅</button>
            <button class="option" onclick="check(true)">銀</button>
            <button class="option" onclick="check(false)">スズ</button>
            <button class="option" onclick="check(false)">亜鉛</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        function check(isCorrect) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            if (isCorrect) {
                resultDiv.innerText = "✅ 正解です！";
                resultDiv.style.color = "#27ae60";
            } else {
                resultDiv.innerText = "❌ 不正解です。正解は「銀」です。";
                resultDiv.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
