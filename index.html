<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歯科国試 問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Serif+Display&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#0B5E48;
  --green-mid:#1A8A66;
  --green-light:#2DBF8C;
  --green-pale:#E8F7F2;
  --green-pale2:#C5EDDF;
  --red:#C0392B;
  --red-pale:#FDECEA;
  --gold:#C8973A;
  --bg:#F4F7F5;
  --white:#FFFFFF;
  --gray1:#1C2826;
  --gray2:#3D5450;
  --gray3:#6B8882;
  --gray4:#A8C4BC;
  --gray5:#D4E6DF;
  --radius:14px;
  --shadow:0 4px 24px rgba(11,94,72,0.10);
}

html,body{height:100%;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--gray1);font-size:15px;-webkit-font-smoothing:antialiased}

.page{display:none;min-height:100vh;animation:fadeSlide .32s ease}
.page.active{display:flex;flex-direction:column}
@keyframes fadeSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* PAGE 1 */
#page-subject{
  background: linear-gradient(160deg,#0B3D2E 0%,#0F6E52 55%,#1A9E72 100%);
  align-items:center;justify-content:center;padding:2rem 1.25rem;
}
.subject-hero{text-align:center;max-width:480px;width:100%}
.subject-hero .tooth-icon{font-size:64px;margin-bottom:1rem;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.3))}
.subject-hero h1{font-size:clamp(22px,5vw,32px);font-weight:900;color:#fff;letter-spacing:-0.5px;margin-bottom:.4rem;line-height:1.2}
.subject-hero p{color:rgba(255,255,255,0.65);font-size:14px;margin-bottom:2.5rem}
.subject-cards{display:flex;flex-direction:column;gap:1rem;width:100%}
.subject-card{
  background:rgba(255,255,255,0.12);
  border:1.5px solid rgba(255,255,255,0.22);
  border-radius:16px;padding:1.4rem 1.5rem;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:1rem;
  backdrop-filter:blur(8px);
  text-align:left;
}
.subject-card:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.45);transform:translateY(-2px)}
.subject-card:active{transform:translateY(0)}
.subject-card .s-icon{font-size:36px;flex-shrink:0}
.subject-card .s-info h2{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.subject-card .s-info p{font-size:12px;color:rgba(255,255,255,0.6)}
.subject-card .s-arrow{margin-left:auto;font-size:20px;color:rgba(255,255,255,0.5);flex-shrink:0}

/* PAGE 2 */
#page-chapter{flex-direction:column}
.chapter-header{
  background:var(--green);
  padding:1.25rem 1.25rem 1rem;
  position:sticky;top:0;z-index:10;
}
.chapter-header .back-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,0.75);font-size:13px;font-weight:600;
  background:none;border:none;cursor:pointer;padding:0;margin-bottom:.75rem;
  transition:color .15s;
}
.chapter-header .back-btn:hover{color:#fff}
.chapter-header h2{font-size:20px;font-weight:900;color:#fff;margin-bottom:.3rem}
.chapter-header p{font-size:13px;color:rgba(255,255,255,0.6)}

.chapter-body{padding:1.25rem;flex:1}
.chapter-grid{display:flex;flex-direction:column;gap:.75rem}
.chapter-item{
  background:var(--white);border:1.5px solid var(--gray5);
  border-radius:var(--radius);padding:1.1rem 1.25rem;
  cursor:pointer;display:flex;align-items:center;gap:1rem;
  transition:all .18s;box-shadow:var(--shadow);
}
.chapter-item:hover{border-color:var(--green-mid);background:var(--green-pale);transform:translateX(4px)}
.chapter-item .ch-num{
  width:40px;height:40px;border-radius:10px;
  background:var(--green-pale2);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--green);flex-shrink:0;
}
.chapter-item.done .ch-num{background:var(--green);color:#fff}
.chapter-item .ch-info{flex:1}
.chapter-item .ch-info h3{font-size:15px;font-weight:700;color:var(--gray1);margin-bottom:3px}
.chapter-item .ch-info p{font-size:12px;color:var(--gray3)}
.chapter-item .ch-score{text-align:right;flex-shrink:0}
.chapter-item .ch-score .score-num{font-size:18px;font-weight:900;color:var(--green)}
.chapter-item .ch-score .score-label{font-size:10px;color:var(--gray3)}
.chapter-item .ch-arrow{font-size:16px;color:var(--gray4);flex-shrink:0}

/* PAGE 3 */
#page-quiz{flex-direction:column}
.quiz-header{
  background:var(--white);border-bottom:1px solid var(--gray5);
  padding:.9rem 1.25rem .75rem;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.quiz-header-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem}
.quiz-header .back-btn{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--green);font-size:13px;font-weight:700;
  background:none;border:none;cursor:pointer;padding:0;
  transition:color .15s;white-space:nowrap;
}
.quiz-header .back-btn:hover{color:var(--green-mid)}
.quiz-header h3{font-size:14px;font-weight:700;color:var(--gray2);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-wrap{display:flex;align-items:center;gap:.75rem}
.progress-bar{flex:1;height:7px;background:var(--gray5);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green-mid),var(--green-light));border-radius:99px;transition:width .4s ease}
.prog-text{font-size:12px;font-weight:700;color:var(--green);white-space:nowrap}
.stats-row{display:flex;gap:.5rem}
.stat-chip{flex:1;background:var(--green-pale);border-radius:8px;padding:.35rem .5rem;text-align:center}
.stat-chip .sn{font-size:16px;font-weight:900;color:var(--green);line-height:1}
.stat-chip .sl{font-size:10px;color:var(--gray3);margin-top:1px}

.quiz-body{padding:.75rem 1rem 2rem;flex:1;overflow-y:auto}

.q-card{
  background:var(--white);border:1.5px solid var(--gray5);
  border-radius:var(--radius);margin-bottom:.75rem;
  box-shadow:var(--shadow);overflow:hidden;
}
.q-card-head{
  display:flex;align-items:center;gap:.5rem;
  padding:.75rem 1rem .5rem;flex-wrap:wrap;
}
.q-num-badge{
  background:var(--green);color:#fff;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
}
.q-type-badge{
  background:var(--gray5);color:var(--gray2);
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;
}
.q-status-badge{font-size:12px;font-weight:700;margin-left:auto}
.q-status-badge.ok{color:var(--green)}
.q-status-badge.ng{color:var(--red)}

.q-text-area{padding:.25rem 1rem .75rem;font-size:15px;font-weight:600;line-height:1.7;color:var(--gray1)}

.options{
  padding:0 .75rem .75rem;
  display:grid;
  grid-template-columns:1fr;
  gap:.5rem;
}
.option{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.65rem .85rem;border:2px solid var(--gray5);
  border-radius:10px;cursor:pointer;transition:all .15s;
  font-size:14px;line-height:1.55;color:var(--gray1);
  background:var(--bg);min-height:0;
}
.option:hover:not(.locked){border-color:var(--green-mid);background:var(--green-pale)}
.option.selected{border-color:var(--green-mid);background:var(--green-pale)}
.option.correct{border-color:var(--green-mid);background:#E8F7F2}
.option.wrong{border-color:var(--red);background:var(--red-pale)}
.option.locked{cursor:default}
.opt-lbl{font-weight:800;font-size:13px;color:var(--gray4);flex-shrink:0;padding-top:1px;min-width:18px}
.option.selected .opt-lbl,.option.correct .opt-lbl{color:var(--green)}
.option.wrong .opt-lbl{color:var(--red)}

.submit-wrap{padding:.25rem .75rem .75rem}
.submit-btn{
  width:100%;padding:.75rem;border-radius:10px;
  border:none;background:var(--green);
  font-size:15px;font-weight:700;cursor:pointer;color:#fff;
  transition:all .15s;font-family:inherit;
}
.submit-btn:hover{background:var(--green-mid)}
.submit-btn:disabled{background:var(--gray4);cursor:not-allowed}

.result-box{margin:.25rem .75rem .75rem;padding:.85rem 1rem;border-radius:10px;font-size:13px;line-height:1.7}
.result-box.ok-r{background:#E8F7F2;border:1.5px solid var(--green-pale2)}
.result-box.ng-r{background:var(--red-pale);border:1.5px solid #F5BCBA}
.result-title{font-weight:800;margin-bottom:.3rem;font-size:14px}
.correct-ans{font-weight:700;color:var(--green);margin-bottom:.35rem;font-size:13px}
.ng-r .correct-ans{color:var(--red)}
.exp-text{font-size:13px;line-height:1.75;color:var(--gray2)}

.complete-card{
  background:var(--white);border:2px solid var(--green-pale2);
  border-radius:var(--radius);padding:2rem 1.5rem;
  text-align:center;margin-bottom:1rem;box-shadow:var(--shadow);
}
.complete-card h3{font-size:16px;font-weight:700;color:var(--gray2);margin-bottom:.5rem}
.complete-score{font-size:56px;font-weight:900;color:var(--green);line-height:1;margin:.5rem 0}
.complete-rate{font-size:14px;color:var(--gray3);margin-bottom:1.25rem}
.retry-btn{
  padding:.75rem 2rem;border-radius:10px;
  border:2px solid var(--green);background:#fff;
  font-size:15px;font-weight:700;cursor:pointer;color:var(--green);
  transition:all .15s;font-family:inherit;
}
.retry-btn:hover{background:var(--green);color:#fff}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page active" id="page-subject">
  <div class="subject-hero">
    <div class="tooth-icon">🦷</div>
    <h1>歯科国試 問題集</h1>
    <p>科目を選んでスタート</p>
    <div class="subject-cards">
      <button class="subject-card" onclick="selectSubject('masui')">
        <span class="s-icon">💉</span>
        <div class="s-info">
          <h2>歯科麻酔学</h2>
          <p>7チャプター・150問収録</p>
        </div>
        <span class="s-arrow">›</span>
      </button>
      <button class="subject-card" onclick="selectSubject('rad')">
        <span class="s-icon">🩻</span>
        <div class="s-info">
          <h2>歯科放射線学</h2>
          <p>8チャプター・100問収録</p>
        </div>
        <span class="s-arrow">›</span>
      </button>
    </div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page-chapter">
  <div class="chapter-header">
    <button class="back-btn" onclick="goToSubject()">‹ 科目選択へ</button>
    <h2 id="ch-subject-title">歯科麻酔学</h2>
    <p id="ch-subject-sub">チャプターを選んでください</p>
  </div>
  <div class="chapter-body">
    <div class="chapter-grid" id="chapter-grid"></div>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page-quiz">
  <div class="quiz-header">
    <div class="quiz-header-top">
      <button class="back-btn" onclick="goToChapter()">‹ チャプター</button>
      <h3 id="quiz-chapter-title"></h3>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
      <span class="prog-text" id="prog-text">0/0</span>
    </div>
    <div class="stats-row">
      <div class="stat-chip"><div class="sn" id="s-answered">0</div><div class="sl">解答済み</div></div>
      <div class="stat-chip"><div class="sn" id="s-correct">0</div><div class="sl">正解</div></div>
      <div class="stat-chip"><div class="sn" id="s-rate">0%</div><div class="sl">正解率</div></div>
    </div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
</div>

<script>
const MASUI_CHAPTERS=[
  {id:'m1',label:'Ch01 局所麻酔法'},
  {id:'m2',label:'Ch02 全身麻酔法'},
  {id:'m3',label:'Ch03 精神鎮静法'},
  {id:'m4',label:'Ch04 全身的偶発症'},
  {id:'m5',label:'Ch05 留意すべき疾患'},
  {id:'m6',label:'Ch06 疼痛緩和治療'},
  {id:'m7',label:'Ch07 救急蘇生法'},
];
const RAD_CHAPTERS=[
  {id:'r1',label:'Ch01 放射線・機器・器材'},
  {id:'r2',label:'Ch02 読影の基本'},
  {id:'r3',label:'Ch03 画像検査法'},
  {id:'r4',label:'Ch04 画像診断：歯・歯周'},
  {id:'r5',label:'Ch05 画像診断：口腔隣接'},
  {id:'r6',label:'Ch06 放射線治療'},
  {id:'r7',label:'Ch07 放射線の影響と健康'},
  {id:'r8',label:'Ch08 防護・法的規制'},
];

const ALL_QUESTIONS={
masui:{
m1:[
// --- 既存14問 ---
{q:"浸潤麻酔時の疼痛を軽減する方法として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["薬液を一気に組織内に注入する","エピネフリンを含む薬液を用いる","粘膜を緊張させて刺入する","鋭利な細い針を用いる","体温に近い温度の薬液を用いる"],correct:[2,3,4],exp:"疼痛軽減：粘膜を緊張させると痛点密度が低下し刺入がスムーズになる。鋭利な細い針は刺入痛を軽減し薬液の注入も緩やかになる。体温に近い薬液はゆっくり注入することで痛みが軽減される。薬液を一気に注入すると激しい疼痛を伴う。エピネフリンは血管収縮薬で疼痛と直接関連しない。"},
{q:"2%リドカイン塩酸塩1.8mL製剤に含まれるアドレナリンの量はどれか。1つ選べ。",t:"4択",opts:["0.0125mg","0.0225mg","0.045mg","0.225mg"],correct:[1],exp:"2%リドカイン塩酸塩製剤には1.0mL中にアドレナリン0.0125mgが含まれる。1.8mL製剤では0.0125×1.8＝0.0225mgとなる。血管収縮薬の含有量は製剤の用量計算において重要な数値である。"},
{q:"3%プロピトカイン塩酸塩1.8mL製剤中のプロピトカイン塩酸塩の含有量はどれか。1つ選べ。",t:"4択",opts:["0.054mg","5.4mg","54mg","540mg"],correct:[2],exp:"3%プロピトカイン塩酸塩は1mL中に30mg含まれる。1.8mL製剤では1800mg×0.03＝54mgとなる。また同製剤にはフェリプレシン0.054単位が血管収縮薬として含まれる。高血圧症患者に用いられることが多い。"},
{q:"リドカインの特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["エステル型局所麻酔薬である","アミド型局所麻酔薬である","アレルギー反応は起こりにくい","プロカインより効果発現が遅い","主に肺で代謝される"],correct:[1,2],exp:"リドカインはアミド型局所麻酔薬であり、エステル型と比較してアレルギー反応が起こりにくい。エステル型（プロカイン、コカインなど）は代謝産物のパラアミノ安息香酸(PABA)によるアレルギー反応が問題となる。リドカインは主に肝臓で代謝される。"},
{q:"伝達麻酔の効果が現れるまでの時間として正しいのはどれか。1つ選べ。",t:"4択",opts:["約1分","約5分","約15分","約30分"],correct:[1],exp:"伝達麻酔（下顎孔伝達麻酔など）は浸潤麻酔より深い部位に注射するため、効果発現まで約5分程度かかる。浸潤麻酔は通常1〜3分で効果が現れる。"},
{q:"局所麻酔薬の最高投与量（基準）として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["2%リドカイン（血管収縮薬含有）：300mg","2%リドカイン（血管収縮薬含有）：500mg","3%プロピトカイン（血管収縮薬含有）：400mg","3%プロピトカイン（血管収縮薬含有）：600mg","2%リドカイン（血管収縮薬非含有）：400mg"],correct:[1,3],exp:"2%リドカイン塩酸塩（血管収縮薬含有）の基準最高用量は500mgで、1.8mL製剤では約14本分に相当する。3%プロピトカイン塩酸塩（フェリプレシン含有）の基準最高用量は600mgである。血管収縮薬非含有の場合はそれぞれ200mg、400mgに減少する。"},
{q:"表面麻酔薬として用いられるのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["リドカイン","プロカイン","コカイン","メピバカイン","ブピバカイン"],correct:[0,2],exp:"表面麻酔薬として使用されるのはリドカイン（塩酸リドカイン外用液やリドカイン含有スプレー）とコカインである。コカインは粘膜からの吸収が良く血管収縮作用も持つため、耳鼻科領域でも使用される。プロカインは表面麻酔作用が弱く、ブピバカイン・メピバカインは主に浸潤・伝達麻酔に用いられる。"},
{q:"下顎孔伝達麻酔の注射部位として正しいのはどれか。1つ選べ。",t:"4択",opts:["翼突下顎縫線上の咬合平面より1cm上方","翼突下顎縫線上の咬合平面と同じ高さ","翼突下顎縫線上の咬合平面より1cm下方","頬脂肪体の後方"],correct:[0],exp:"下顎孔伝達麻酔（Halsted法）では、翼突下顎縫線（翼突下顎ひだ）の中点〜外側1/3に沿って、咬合平面より約1cm上方を目標に注射を行う。これにより下歯槽神経が下顎孔に入る直前でブロックされる。"},
{q:"局所麻酔薬の血管収縮薬として用いられるのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["アドレナリン（エピネフリン）","フェリプレシン","ノルアドレナリン","ドパミン","アセチルコリン"],correct:[0,1,2],exp:"歯科用局所麻酔薬に配合される血管収縮薬はアドレナリン（エピネフリン）・フェリプレシン・ノルアドレナリンである。アドレナリンはα受容体・β受容体の両方に作用し、最も広く使われる。フェリプレシンはバソプレシン誘導体でβ作用がないため心疾患患者に適する。ノルアドレナリンはα受容体優位に作用する。"},
{q:"局所麻酔薬中毒（全身毒性）の初期症状として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["徐脈","口周囲のしびれ・耳鳴り","血圧上昇","興奮・多弁","縮瞳"],correct:[1,3],exp:"局所麻酔薬中毒の初期症状（CNS興奮期）は口周囲・舌尖のしびれ、耳鳴り、興奮・多弁・不安感などである。その後痙攣、CNS抑制（意識消失）、心臓毒性（不整脈・心停止）へと移行する。血管内誤注入では急激かつ重篤な中毒症状が現れる。"},
{q:"プロピトカイン塩酸塩に含まれる血管収縮薬はどれか。1つ選べ。",t:"4択",opts:["アドレナリン","ノルアドレナリン","フェリプレシン","バソプレシン"],correct:[2],exp:"3%プロピトカイン塩酸塩製剤に配合されている血管収縮薬はフェリプレシンである。フェリプレシンは合成バソプレシン誘導体でβ受容体作動作用がないため心臓への負担が少なく、心疾患・高血圧患者に適している。アドレナリンはリドカイン製剤に配合される。"},
{q:"局所麻酔薬の組織浸透性に関係するのはどれか。1つ選べ。",t:"4択",opts:["分子量","脂溶性","タンパク結合率","pKa"],correct:[3],exp:"局所麻酔薬のpKaは、非イオン型（塩基型）と解離型（陽イオン型）の比率に影響し、組織浸透性に関わる。非イオン型が脂質二重膜を透過して神経内に入り込む。pKaが生体pHに近いほど非イオン型の割合が多く、効果発現が早い。脂溶性は効力の強さ、タンパク結合率は作用持続時間に関係する。"},
{q:"フェリプレシンを含む局所麻酔薬が適しているのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["甲状腺機能亢進症","妊婦","心疾患患者","高血圧症患者","糖尿病患者"],correct:[2,3],exp:"フェリプレシン含有製剤（プロピトカイン）はβ作動作用がないため心臓への負担が少なく、心疾患・高血圧症患者に適している。ただし妊婦には子宮収縮作用があるため禁忌とされる。アドレナリン含有製剤は甲状腺機能亢進症・重篤な心疾患では慎重投与が必要。"},
{q:"局所麻酔後に起こりうる合併症として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["血管迷走神経反射（失神）","アナフィラキシーショック","血管内誤注入による中毒","開口障害（トリスムス）","骨折"],correct:[0,1,2,3],exp:"局所麻酔後の合併症には、血管迷走神経反射（処置不安・疼痛による）、アレルギー反応・アナフィラキシー、血管内誤注入による局所麻酔薬中毒、針刺し後のトリスムス（筋肉内誤注射）がある。骨折は局所麻酔の合併症としては起こりにくい。"},
// --- 新規追加 8問 ---
{q:"局所麻酔薬に含まれるアドレナリンの主な作用として正しいのはどれか。1つ選べ。",t:"4択",opts:["不安の除去","呼吸促進の防止","血圧上昇の抑制","麻酔効果時間の延長"],correct:[3],exp:"アドレナリン（血管収縮薬）は末梢血管を収縮させることで局所麻酔薬の血管内への吸収を減少させる。その結果、局所麻酔薬が局所に貯留する割合が増加し、麻酔効果の持続時間が延長する。出血の抑制・局所麻酔薬中毒予防・局所麻酔効果の増強も目的である。"},
{q:"上顎前歯部の浸潤麻酔で麻酔される神経はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["上歯槽前神経","上歯槽後神経","鼻口蓋神経","大口蓋神経","頬神経"],correct:[0,2],exp:"上顎前歯部（切歯・犬歯）の浸潤麻酔では、唇側から上歯槽前神経（歯と歯槽骨の知覚）を、口蓋側から鼻口蓋神経（切歯乳頭付近の口蓋粘膜）をブロックする。上歯槽後神経は上顎大臼歯の浸潤麻酔に関係する。"},
{q:"局所麻酔薬の持続時間に最も関係するのはどれか。1つ選べ。",t:"4択",opts:["pKa","脂溶性","タンパク結合率","分子量"],correct:[2],exp:"タンパク結合率が高いほど、局所麻酔薬が神経膜タンパクに強く結合するため、作用持続時間が長くなる。ブピバカインは高タンパク結合率（95%）で長時間作用型。リドカインは中程度（65%）。pKaは効果発現速度、脂溶性は麻酔効力に関係する。"},
{q:"歯科用局所麻酔薬のカートリッジ1本（1.8mL）に含まれる2%リドカインの量はどれか。1つ選べ。",t:"4択",opts:["18mg","36mg","54mg","72mg"],correct:[1],exp:"2%リドカインは1mL中に20mgのリドカインを含む。1.8mLカートリッジでは20mg×1.8＝36mgとなる。局所麻酔薬の用量計算の基本として必ず覚えておく。最高用量500mgなので1.8mL製剤では約13〜14本が上限となる。"},
{q:"下顎孔伝達麻酔（Halsted法）で麻酔される神経として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["下歯槽神経","舌神経","頬神経","大耳介神経","眼窩下神経"],correct:[0,1,2],exp:"Halsted法（下顎孔伝達麻酔）では、①下歯槽神経（下顎の歯・歯槽骨・下唇・オトガイ部）、②舌神経（舌前2/3・口底粘膜）、③頬神経（頬粘膜・歯肉）が麻酔される。術野の広い下顎臼歯部手術に適する。"},
{q:"局所麻酔薬の炎症組織への効果について正しいのはどれか。1つ選べ。",t:"4択",opts:["炎症部位ではpHが上昇するため効果が増強","炎症部位ではpHが低下するため効果が減弱","炎症の有無は効果に関係しない","炎症部位では血管収縮薬が増強される"],correct:[1],exp:"炎症組織は代謝産物の蓄積によりpHが低下（酸性）している。局所麻酔薬は非解離型（塩基型）で組織に浸透するが、pHが低いと解離型（陽イオン型）が増えて非解離型が減少するため、組織浸透性が低下し麻酔効果が減弱する。"},
{q:"口蓋大孔（大口蓋孔）からの伝達麻酔で麻酔される部位はどれか。1つ選べ。",t:"4択",opts:["口蓋前方（前歯部口蓋側）","口蓋後方（大臼歯〜軟口蓋）","舌前2/3","頬粘膜"],correct:[1],exp:"大口蓋孔（口蓋大孔）伝達麻酔では大口蓋神経をブロックし、上顎大臼歯〜小臼歯部の口蓋側歯肉・口蓋粘膜後方が麻酔される。口蓋前方（切歯・犬歯の口蓋側）は鼻口蓋神経（切歯管）伝達麻酔が担当する。"},
{q:"局所麻酔薬の効力（麻酔力の強さ）に最も関係するのはどれか。1つ選べ。",t:"4択",opts:["pKa","脂溶性","タンパク結合率","分子量"],correct:[1],exp:"局所麻酔薬の効力（麻酔力の強さ）は脂溶性と相関する。脂溶性が高いほど神経膜の脂質二重層への浸透が容易で、より少量で神経ブロックが得られる。ブピバカインはリドカインより脂溶性が高く、麻酔力も強い。"},
],
m2:[
// --- 既存14問 ---
{q:"全身麻酔の三要素として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["鎮痛","鎮静（催眠）","筋弛緩","血圧維持","酸素投与"],correct:[0,1,2],exp:"全身麻酔の三要素（麻酔の三徴）は①鎮痛、②意識消失（鎮静・催眠）、③筋弛緩である。この3要素を適切に制御することで安全な全身麻酔が可能となる。現代の均衡麻酔ではそれぞれの要素を異なる薬剤で担当する。"},
{q:"術前検査で呼吸器障害の病型分類に利用されるのはどれか。1つ選べ。",t:"4択",opts:["心電図","血液ガス分析","カプノグラフィ","スパイロメトリ","パルスオキシメータ"],correct:[3],exp:"スパイロメトリはスパイロメータを用いて行う呼吸機能検査で、肺活量・1回換気量・1秒量などを測定できる。肺気量分画の情報から拘束性換気障害・閉塞性換気障害・混合性換気障害など呼吸器障害の病型分類が可能である。"},
{q:"パルスオキシメータが有用な病態はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["上気道閉塞","過換気症候群","クモ膜下出血","血管迷走神経反射","異常絞扼反射"],correct:[0,3],exp:"パルスオキシメータはSpO₂と脈拍数をリアルタイムに測定できる。上気道閉塞ではSpO₂が低下するため早期発見に有用。血管迷走神経反射（迷走神経反射性失神）では副交感神経優位により脈拍数が低下するため検出可能。過換気症候群ではSpO₂は正常のため判別できない。"},
{q:"医療用酸素ボンベ（ガス容量500L、最高充填圧力14.7MPa）で、圧力計が8MPaを示すとき、3L/分で使用した場合の使用可能時間はどれか。1つ選べ。",t:"4択",opts:["約30分","約45分","約90分","約135分"],correct:[2],exp:"酸素ボンベの残量＝容量×（現在圧力÷最高充填圧力）＝500×(8÷14.7)≒272L。使用可能時間＝272÷3≒90.6分。よって約90分が正解。酸素残量の計算は全身麻酔管理において非常に重要である。"},
{q:"全身麻酔薬の静脈内投与薬として用いられるのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["セボフルラン","プロポフォール","亜酸化窒素","ケタミン","イソフルラン"],correct:[1,3],exp:"静脈内麻酔薬（IVA）としてはプロポフォール（ジプリバン）とケタミンが代表的である。プロポフォールは維持・TIVA（完全静脈麻酔）に広く使用される。ケタミンは解離性麻酔薬で鎮痛・気管支拡張作用がある。セボフルラン・亜酸化窒素・イソフルランは吸入麻酔薬である。"},
{q:"1回換気量（TV）の正常値として正しいのはどれか。1つ選べ。",t:"4択",opts:["約150mL","約350mL","約500mL","約1200mL"],correct:[2],exp:"安静呼吸における1回換気量（TV：Tidal Volume）の正常値は成人で約500mLである。予備吸気量（IRV）は約1500mL、予備呼気量（ERV）は約1100mL、残気量（RV）は約1200mLが目安である。"},
{q:"全身麻酔の気道確保法として用いられるのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["経口気管挿管","経鼻気管挿管","喉頭マスク（LMA）","鼻腔エアウェイ","下顎前突法のみ"],correct:[0,1,2],exp:"全身麻酔の気道確保法として経口気管挿管・経鼻気管挿管・喉頭マスク（LMA：laryngeal mask airway）が代表的である。歯科・口腔外科領域では術野の確保上、経鼻気管挿管が多く用いられる。鼻腔エアウェイや下顎前突法は補助的手技で、単独では確実な気道確保とはならない。"},
{q:"全身麻酔の前投薬の目的として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["麻酔導入の円滑化","術後の疼痛完全除去","気道分泌物の抑制","術中出血の停止","筋弛緩効果の延長"],correct:[0,2],exp:"前投薬（プレメディケーション）の主な目的は、①不安除去・鎮静により麻酔導入を円滑にすること、②抗コリン薬（アトロピン等）投与による気道分泌物・唾液分泌の抑制である。制酸薬の投与（誤嚥性肺炎予防）も含まれる。"},
{q:"吸入麻酔薬の最小肺胞濃度（MAC）について正しいのはどれか。1つ選べ。",t:"4択",opts:["MACが大きいほど強力な麻酔薬","MACが小さいほど強力な麻酔薬","MACは年齢に関係しない","MACは体重に比例する"],correct:[1],exp:"MAC（Minimum Alveolar Concentration：最小肺胞濃度）は、50%の患者で痛み刺激に対する体動を抑制するのに必要な吸入麻酔薬の肺胞内濃度。MACが小さいほど少量で効果を発揮するため、強力な麻酔薬である。高齢では低下、小児では高い傾向がある。"},
{q:"神経筋遮断薬（筋弛緩薬）として用いられるのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["サクシニルコリン","ベクロニウム","ネオスチグミン","アトロピン","ミダゾラム"],correct:[0,1],exp:"筋弛緩薬にはサクシニルコリン（脱分極性）とベクロニウム・ロクロニウム等（非脱分極性）がある。サクシニルコリンは超短時間作用で気管挿管時に用いられる。ネオスチグミンはAChE阻害薬で筋弛緩の拮抗（リバース）に使用。アトロピンはネオスチグミンによる徐脈防止に併用する。"},
{q:"全身麻酔のステージ（麻酔深度）において、痙攣・呼吸不規則が見られるのはどれか。1つ選べ。",t:"4択",opts:["ステージⅠ（鎮痛期）","ステージⅡ（興奮期）","ステージⅢ（外科的麻酔期）","ステージⅣ（延髄抑制期）"],correct:[1],exp:"Guedelの麻酔深度分類では、ステージⅡ（興奮期・譫妄期）で痙攣・嘔吐・気道分泌増加・不規則呼吸が見られ、最も危険な時期である。誘導・覚醒時に通過するためすみやかに脱出することが重要。ステージⅢが外科的麻酔に適した深度。"},
{q:"プロポフォールの特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["鎮痛作用が強い","TIVA（完全静脈麻酔）に用いられる","覚醒が遅い","制吐作用がある","水溶性製剤である"],correct:[1,3],exp:"プロポフォールはTIVA（全静脈麻酔）に広く使用される。また制吐作用があり術後悪心・嘔吐（PONV）の予防に有利である。覚醒は速やかでクリアである。脂肪乳剤（白色）製剤であり、鎮痛作用はほとんどない。"},
{q:"全身麻酔後の合併症として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["術後悪心・嘔吐（PONV）","喉頭痙攣","誤嚥性肺炎","術中血圧上昇のみ","橋本甲状腺炎の悪化"],correct:[0,1,2],exp:"全身麻酔後の主な合併症には、術後悪心・嘔吐（PONV）、喉頭痙攣（気管挿管による刺激や覚醒時）、誤嚥性肺炎（術後嘔吐による気道への吸引）がある。このほか低体温・シバリング、術後認知機能障害なども重要である。"},
{q:"カプノグラフィで測定されるのはどれか。1つ選べ。",t:"4択",opts:["動脈血酸素飽和度","終末呼気二酸化炭素分圧（EtCO₂）","呼吸数のみ","静脈血酸素分圧"],correct:[1],exp:"カプノグラフィ（カプノメータ）は呼気中のCO₂濃度をリアルタイムに波形（カプノグラム）で表示し、終末呼気CO₂濃度（EtCO₂）を測定する。換気状態の評価・気管挿管確認・心肺蘇生の効果判定に有用である。"},
// --- 新規追加 7問 ---
{q:"開口制限のある挿管困難患者に対して気管挿管を行うのに有用なのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["開口器","後鼻鏡","ビデオ喉頭鏡","超音波診断装置","ファイバースコープ"],correct:[2,4],exp:"開口制限がある挿管困難症例では、①ビデオ喉頭鏡（先端カメラの映像で声門を確認しながら挿管可能）、②ファイバースコープ（経鼻挿管の場合はほぼ開口不要）が有用。開口器は開口制限がある場合は使用できない。"},
{q:"安静時のヘモグロビン酸素飽和度（SpO₂）と動脈血酸素分圧（PO₂）の正しい組み合わせはどれか。1つ選べ。",t:"4択",opts:["SpO₂100%・PO₂90mmHg","SpO₂90%・PO₂60mmHg","SpO₂75%・PO₂30mmHg","SpO₂50%・PO₂10mmHg"],correct:[1],exp:"ヘモグロビン-酸素解離曲線から、SpO₂98%のときPO₂は約100mmHgが正常値。SpO₂90%（下限目安）のときPO₂は約60mmHgに相当する。P₅₀（SpO₂50%のときのPO₂）は約27mmHgである。"},
{q:"全身麻酔の術前評価においてASA身体状態分類でクラスⅡに相当するのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["健康な患者","軽度の全身疾患を有する患者（高血圧・糖尿病・軽度喘息）","日常活動が制限される重篤な全身疾患","生命を脅かす重篤な疾患","死亡が予想される末期疾患"],correct:[1],exp:"ASA（アメリカ麻酔科学会）身体状態分類：クラスⅠ＝健常人、クラスⅡ＝軽度全身疾患（高血圧・糖尿病・軽症喘息・肥満など）、クラスⅢ＝重度全身疾患、クラスⅣ＝生命を脅かす疾患、クラスⅤ＝手術なしでは生存不可能な危篤患者。"},
{q:"気管内挿管の確認方法として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["カプノグラフィでEtCO₂の検出","聴診で両側肺野の呼吸音確認","胸部エックス線で気管チューブ位置確認","脈拍数の変化","SpO₂の低下確認"],correct:[0,1,2],exp:"気管内挿管の確認方法：①カプノグラフィでEtCO₂が検出されれば気管内に挿管されている（食道挿管では検出されない）、②両側の呼吸音聴診、③胸部X線での確認。SpO₂低下は食道誤挿管でも遅れて起こるため確認法としては不十分。"},
{q:"悪性高熱症について正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["吸入麻酔薬・サクシニルコリンが誘因となる","体温の上昇が特徴的","頻度は非常に高い（1/100以下）","治療薬はプロポフォール","ダントロレンナトリウムが有効"],correct:[0,1,4],exp:"悪性高熱症は骨格筋の代謝が急激に亢進する遺伝性疾患で、吸入麻酔薬（セボフルラン・ハロタン等）やサクシニルコリンが誘因となる。体温上昇・頻脈・筋強直・アシドーシスが特徴。治療にはダントロレンナトリウム（筋小胞体Ca²⁺放出阻害）を使用する。頻度は1/10,000〜1/50,000と低い。"},
{q:"全身麻酔導入に用いる静脈麻酔薬の特徴について正しいのはどれか。1つ選べ。",t:"4択",opts:["ケタミンは気管支収縮作用がある","プロポフォールは鎮痛作用が強い","ケタミンは交感神経刺激作用で血圧を上昇させる","プロポフォールは覚醒に時間がかかる"],correct:[2],exp:"ケタミン（解離性麻酔薬）はカテコールアミン放出を促進する交感神経刺激作用があり、血圧・心拍数を上昇させる。そのためショック状態の患者への麻酔導入に向いているが、頭蓋内圧亢進患者には禁忌。プロポフォールは鎮痛作用がほぼなく、覚醒は迅速である。"},
{q:"人工呼吸（陽圧換気）の副作用として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["静脈還流量の増加","気胸（barotrauma）","心拍出量の増加","低血圧","高血圧"],correct:[1,3],exp:"陽圧換気（人工呼吸）では胸腔内圧が上昇し静脈還流（前負荷）が減少するため心拍出量が低下し低血圧が起きやすい。また過度の換気圧は気圧外傷（バロトラウマ）として気胸を引き起こすことがある。自然呼吸（陰圧呼吸）とは逆の循環作用となる。"},
],
m3:[
// --- 既存7問 ---
{q:"笑気（亜酸化窒素）吸入鎮静法の禁忌はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["高血圧症","閉鎖腔を有する疾患（腸閉塞・中耳炎等）","ビタミンB12欠乏症","糖尿病","慢性閉塞性肺疾患（COPD）"],correct:[1,2],exp:"笑気吸入鎮静法の禁忌：①閉鎖腔を有する疾患（腸閉塞・気胸・中耳炎・副鼻腔炎）は笑気が閉鎖腔に拡散し圧上昇を招く。②ビタミンB12欠乏症（悪性貧血含む）は笑気がビタミンB12を酸化不活化するため骨髄抑制が起こりうる。③COPD患者でも相対的禁忌となる場合がある。"},
{q:"静脈内鎮静法（IVS）に用いられる薬物はどれか。3つ選べ。",t:"複数選択（3つ）",opts:["ミダゾラム","ジアゼパム","プロポフォール（低用量）","リドカイン","アスピリン"],correct:[0,1,2],exp:"静脈内鎮静法に用いられる主な薬物は、ベンゾジアゼピン系（ミダゾラム・ジアゼパム）とプロポフォール（鎮静用量）である。ミダゾラムは前向性健忘・抗不安・鎮静作用があり最も頻用される。プロポフォール低用量では意識下鎮静が得られる。"},
{q:"笑気の物理的性質として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["常温で気体","無色無臭","強い鎮痛作用がある","単独で外科的麻酔が可能","可燃性ガスである"],correct:[0,1],exp:"亜酸化窒素（N₂O：笑気）は常温で気体、無色・甘臭（わずかに甘い香り）の性質をもつ。強い鎮痛作用はなく（弱い鎮痛作用）、MACが104%と高いため単独で外科的麻酔は不可能。支燃性（助燃性）であり可燃性ではない。"},
{q:"静脈内鎮静法におけるミダゾラムの拮抗薬はどれか。1つ選べ。",t:"4択",opts:["ネオスチグミン","フルマゼニル","ナロキソン","アトロピン"],correct:[1],exp:"ミダゾラムはベンゾジアゼピン受容体拮抗薬であるフルマゼニル（アネキセート）で拮抗できる。フルマゼニルの半減期はミダゾラムより短いため再鎮静に注意が必要。ナロキソンはオピオイド拮抗薬、ネオスチグミンは筋弛緩拮抗薬である。"},
{q:"笑気吸入鎮静法の鎮静濃度として適切なのはどれか。1つ選べ。",t:"4択",opts:["5〜10%","20〜30%","50〜70%","80〜90%"],correct:[1],exp:"歯科での笑気吸入鎮静法では通常20〜30%の笑気（残りは酸素）を使用する。低濃度から開始し、患者の反応を見ながら調整する。30%を超えると鎮静が深くなりすぎる場合があり、常に30%以上の酸素を維持することが原則である。"},
{q:"精神鎮静法終了後の注意事項として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["笑気終了後は純酸素を吸入させる","静脈内鎮静後は直ちに帰宅可能","笑気は拡散性低酸素症を防ぐため純酸素吸入が必要","帰宅後の自動車運転は問題ない","意識回復の確認は不要"],correct:[0,2],exp:"笑気吸入鎮静法終了後は、拡散性低酸素症（笑気が急速に血液から放出され肺胞の酸素を希釈する現象）を防ぐため、純酸素を3〜5分間吸入させる。静脈内鎮静後は十分な覚醒確認と一定時間の観察が必要で、当日の自動車運転も禁止する。"},
{q:"前意識鎮静（意識下鎮静）の特徴として正しいのはどれか。1つ選べ。",t:"4択",opts:["自発呼吸が消失する","言語疎通が可能","反射が完全に消失する","全身麻酔と同等の深度"],correct:[1],exp:"意識下鎮静（moderate sedation/前意識鎮静）では患者が言語的指示に応答でき、自発呼吸・気道反射が維持された状態を保つ。深鎮静（意識消失に近い状態）や全身麻酔とは区別される。精神鎮静法の目標はこの深度である。"},
// --- 新規追加 8問 ---
{q:"静脈内鎮静中に抜歯を行うときに笑気吸入鎮静法より静脈内鎮静法のほうが適しているのはどれか。1つ選べ。",t:"4択",opts:["気胸","てんかん","気管支喘息","過換気症候群","睡眠時無呼吸症候群"],correct:[4],exp:"睡眠時無呼吸症候群（OSAS）は上気道閉塞による呼吸障害を伴う。静脈内鎮静法では上気道閉塞リスクを高めることがあるが、笑気吸入鎮静法でも上気道閉塞を起こしにくい一方、亜酸化窒素は高濃度酸素と同時吸入するため呼吸に関しては安全性が高い。しかし静脈内鎮静での呼吸抑制により上気道閉塞リスクが増すため笑気吸入が適する。"},
{q:"ミダゾラムによる静脈内鎮静法の特徴として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["前向性健忘（処置中の記憶がなくなる）","鎮痛作用が強い","抗不安・鎮静作用がある","筋弛緩作用がある","フルマゼニルで拮抗できる"],correct:[0,2,4],exp:"ミダゾラム（ベンゾジアゼピン系）の特徴：①前向性健忘（処置の記憶が残らない）、②抗不安・鎮静作用、③筋弛緩作用（若干）、④抗痙攣作用、⑤フルマゼニルで拮抗可能。鎮痛作用はほとんどなく、局所麻酔薬との併用が必要。"},
{q:"デクスメデトミジンの特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["α₂アドレナリン受容体作動薬","呼吸抑制が強い","ベンゾジアゼピン系薬剤","鎮静・鎮痛・抗不安作用をもつ","拮抗薬はフルマゼニル"],correct:[0,3],exp:"デクスメデトミジン（プレセデックス）はα₂アドレナリン受容体作動薬で、鎮静・鎮痛・抗不安の三作用をもつ。呼吸抑制が少ないことが特徴で、ICUや検査時の鎮静に用いられる。拮抗薬はアチパメゾールであり、フルマゼニルではない。"},
{q:"笑気吸入鎮静法で拡散性低酸素症が起こるのはどれか。1つ選べ。",t:"4択",opts:["笑気吸入開始直後","笑気吸入終了直後","局所麻酔注射時","覚醒後30分以上経過後"],correct:[1],exp:"拡散性低酸素症（Diffusion hypoxia）は笑気吸入終了直後に起こる。体内に溶解していた大量の亜酸化窒素が急速に血液から肺胞へ放出され、肺胞内の酸素を希釈してPO₂を低下させる。これを防ぐため終了後に3〜5分間純酸素を吸入させる。"},
{q:"精神鎮静法の適応として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["歯科治療恐怖症患者","嘔吐反射が強い患者","意識清明の協力的な成人患者のみ","重度の知的障害（全身麻酔が必要）","局所麻酔禁忌患者"],correct:[0,1],exp:"精神鎮静法の適応は歯科治療恐怖症・強い絞扼反射（嘔吐反射）・軽度の知的障害・高血圧等の全身疾患で不安軽減が必要な患者など。重度の知的障害で協力が得られない場合は全身麻酔が選択される。"},
{q:"笑気吸入鎮静法の装置として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["フェイスマスクまたは鼻マスクで吸入","酸素濃度は常に30%以上を保つ","純笑気100%で開始する","気管内チューブが必要","閉鎖回路（再呼吸回路）が必須"],correct:[0,1],exp:"笑気吸入鎮静法では鼻マスク（ナサルフード）またはフェイスマスクで吸入する。酸素濃度は低酸素症予防のため常に30%以上（通常50%以上）を確保する。純笑気100%は絶対禁忌。自発呼吸の保持が前提で気管内チューブは不要。"},
{q:"歯科治療恐怖症患者の静脈内鎮静中に過鎮静となり、いびきをかいて深呼吸の指示に応じない場合の対応として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["酸素投与","AEDの使用","胸骨圧迫マッサージ","局所麻酔薬の追加投与","下顎挙上による気道確保"],correct:[0,4],exp:"過鎮静による舌根沈下・上気道閉塞（SpO₂低下・いびき）への対処：①まず下顎挙上・頭部後屈などで気道を確保する。②酸素を投与し低酸素状態を改善する。AEDや胸骨圧迫は心停止時の対応で、本症例では心電図・脈拍ともに正常であるため不要。"},
{q:"亜酸化窒素（笑気）のMACはどれか。1つ選べ。",t:"4択",opts:["1.15%","2.0%","35%","104%"],correct:[3],exp:"亜酸化窒素（笑気）のMACは約104%である。大気圧下では単独で外科的麻酔に必要な濃度（104%）を達成できないため、単独での全身麻酔は不可能。歯科では20〜30%の低濃度で鎮静目的に使用する。"},
],
m4:[
// --- 既存8問 ---
{q:"歯科治療中に最も頻度が高い全身的偶発症はどれか。1つ選べ。",t:"4択",opts:["心筋梗塞","血管迷走神経反射（失神）","アナフィラキシーショック","高血圧クリーゼ"],correct:[1],exp:"歯科治療中の全身的偶発症で最も頻度が高いのは血管迷走神経反射（迷走神経反射性失神、血管迷走神経性失神）である。不安・恐怖・疼痛刺激が引き金となり副交感神経が優位となって徐脈・血圧低下・意識消失が起こる。"},
{q:"アナフィラキシーショックの第一選択薬はどれか。1つ選べ。",t:"4択",opts:["ヒドロコルチゾン静注","ジフェンヒドラミン静注","アドレナリン筋注","アトロピン静注"],correct:[2],exp:"アナフィラキシーショックの第一選択はアドレナリン（エピネフリン）0.3mg（成人）の大腿外側筋注（中間広筋）である。アドレナリンは血管収縮・気管支拡張・心筋収縮力増大により迅速にショックを改善する。ステロイド・抗ヒスタミン薬は補助的治療である。"},
{q:"過換気症候群の対処法として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["ペーパーバッグ法（紙袋呼吸）","酸素マスクによる高濃度酸素投与","会話・精神的安定化","β遮断薬の投与","フロセミドの投与"],correct:[0,2],exp:"過換気症候群の対処：①ペーパーバッグ法で呼気CO₂を再呼吸させ呼吸性アルカローシスを改善する（ただし低酸素症の鑑別後）。②声かけ・安心感の提供で過呼吸を鎮める。高濃度酸素は症状を悪化させる可能性がある（呼吸ドライブが維持されている場合）。"},
{q:"血管迷走神経反射（失神）の症状として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["徐脈","血圧低下","意識消失（一過性）","体温上昇","高血糖"],correct:[0,1,2],exp:"血管迷走神経反射では迷走神経（副交感神経）優位となり、徐脈・血圧低下・顔面蒼白・冷汗・悪心・嘔吐・一過性意識消失が生じる。治療は仰臥位（下肢挙上）にして脳への血流を確保することが基本である。"},
{q:"局所麻酔薬中毒の血管内誤注入時の症状として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["痙攣","遅発性に症状が現れる","心室細動","口周囲のしびれのみが長時間続く","まず徐脈から始まる"],correct:[0,2],exp:"血管内誤注入では局所麻酔薬が急速に高濃度で循環するため、即座に痙攣・意識消失・心室細動などの重篤な症状が現れる。通常の血管外注射では組織からの吸収により比較的緩徐に症状が出現する（口周囲しびれ→興奮→痙攣→抑制）。"},
{q:"歯科治療時に誘発される可能性のある呼吸停止の原因として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["局所麻酔薬中毒","血管迷走神経反射の重症例","単純な不安のみ","過換気症候群（軽症）","歯石除去"],correct:[0,1],exp:"歯科治療中の呼吸停止は、局所麻酔薬の大量血管内誤注入による中毒（心抑制・脳幹抑制）や、血管迷走神経反射の重症例（心停止まで至る場合）が原因となりうる。早期認識と迅速な気道確保・蘇生処置が重要である。"},
{q:"歯科治療中の高血圧クリーゼへの対応として正しいのはどれか。1つ選べ。",t:"4択",opts:["治療をそのまま継続する","直ちに降圧薬を大量投与する","治療を中断し安静、必要なら専門医へ搬送","アドレナリン含有麻酔薬をさらに追加"],correct:[2],exp:"高血圧クリーゼ（180/120mmHg以上）では歯科治療を中断し、安静を保ち、内科医または救急への対応が必要である。急激な降圧は臓器虚血を招くため禁忌。アドレナリン含有麻酔薬はさらなる血圧上昇を招く。"},
{q:"アナフィラキシーの皮膚症状として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["蕁麻疹","紅潮（フラッシング）","白斑","浮腫なし","痤瘡（ニキビ）"],correct:[0,1],exp:"アナフィラキシーの皮膚症状には蕁麻疹・紅潮（フラッシング）・掻痒感・血管浮腫（クインケ浮腫）がある。これらはヒスタミン・プロスタグランジン等の遊離による。呼吸困難・血圧低下とともに判断材料となる。"},
// --- 新規追加 7問 ---
{q:"歯科治療中にアナフィラキシーショックを遭遇した。初期対応の順序として正しいのはどれか。1つ選べ。",t:"4択",opts:["抗ヒスタミン薬投与→アドレナリン投与→119番通報","アドレナリン筋注→仰臥位・下肢挙上→119番通報","ステロイド静注→輸液→気道確保","気道確保→除細動→アドレナリン投与"],correct:[1],exp:"アナフィラキシーの初期対応：①アドレナリン0.3mg大腿外側筋注（最優先）、②仰臥位で下肢挙上（ショック体位）、③119番通報・酸素投与・輸液。抗ヒスタミン薬・ステロイドは二次的投与で、アドレナリンの後に行う。"},
{q:"低血糖発作の症状として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["冷汗・振戦","頻脈","意識障害","高体温","多尿"],correct:[0,1,2],exp:"低血糖発作（血糖60mg/dL以下）の症状：①交感神経症状（冷汗・振戦・頻脈・動悸・顔面蒼白）、②中枢神経症状（頭痛・集中力低下・意識障害・痙攣）。糖尿病治療患者でインスリン過剰・食事制限・歯科治療ストレスが誘因となる。"},
{q:"歯科治療中の誤飲・誤嚥への対応として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["誤嚥した場合はハイムリック法を施行","誤飲（消化管迷入）の場合は経過観察と定期的X線確認","誤飲では直ちに催吐薬を投与","誤嚥では気管切開を即座に行う","誤飲と誤嚥は同じ対処法で良い"],correct:[0,1],exp:"誤嚥（気道への迷入）：窒息なら背部叩打・ハイムリック法、気道確保。誤飲（消化管への迷入）：鋭利でなければ通常は自然排出を待ち、定期的X線撮影で排出を確認する。催吐は鋭利な異物では禁忌。誤嚥と誤飲では対応が異なる。"},
{q:"歯科治療中に突然患者が意識を失った。最初に確認すべきはどれか。1つ選べ。",t:"4択",opts:["血糖値の測定","頸動脈拍動の確認","脈なし確認後にAEDを装着","安全確認（呼びかけ・肩たたき）と応援要請"],correct:[3],exp:"BLSの第一歩は安全確認→反応確認（呼びかけ・肩たたき）→反応がなければ応援要請（119番・AED手配）。その後気道確保・呼吸確認→心停止確認→胸骨圧迫開始の順に進む。いきなり脈拍や血糖を確認するのではなく反応確認が最優先。"},
{q:"気管支喘息発作の対処として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["β₂刺激薬（サルブタモール）の吸入","高濃度酸素投与","アスピリンの投与","アドレナリン筋注（重症時）","ベータ遮断薬の投与"],correct:[0,3],exp:"喘息発作への対応：①軽症〜中等症ではβ₂刺激薬（サルブタモール等）の吸入が第一選択。②重症・アナフィラキシー合併例はアドレナリン（エピネフリン）0.3mg筋注。アスピリン喘息（アスピリン過敏）では禁忌。β遮断薬は気管支収縮を悪化させるため禁忌。"},
{q:"過換気症候群と低血糖発作の鑑別に有用なのはどれか。1つ選べ。",t:"4択",opts:["血圧測定","血糖測定","脈拍数の確認","SpO₂の測定"],correct:[1],exp:"過換気症候群と低血糖発作はともに不安感・発汗・振戦・意識障害を呈することがある。鑑別には血糖測定が最も有用で、低血糖（60mg/dL以下）であれば低血糖発作と判断できる。SpO₂は過換気では通常正常（または上昇）で特異的でない。"},
{q:"フェリプレシン含有局所麻酔薬（3%プロピトカイン）でアナフィラキシーショックが起きた際に最も考えられる原因物質はどれか。1つ選べ。",t:"4択",opts:["プロピトカイン塩酸塩本体","フェリプレシン","防腐剤（パラベン類）","注射針の金属成分"],correct:[2],exp:"アミド型局所麻酔薬（プロピトカイン・リドカイン）自体のアレルギーは稀で、添加物の防腐剤（パラベン類・メタ亜硫酸水素ナトリウム等）によるアレルギー反応が多い。エステル型（プロカイン）はパラアミノ安息香酸代謝産物でのアレルギーが多い。"},
],
m5:[
// --- 既存8問 ---
{q:"糖尿病患者の歯科治療で注意すべき事項として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["術前の血糖値確認","低血糖発作への対応準備","治療は空腹時に行う","感染への抵抗力の低下を考慮","局所麻酔薬はすべて禁忌"],correct:[0,1,3],exp:"糖尿病患者への対応：①術前に血糖値を確認（空腹時200mg/dL以下が目安）、②食事をとった後（餓死の時間帯を避ける）に治療し低血糖に備える、③白血球機能低下により感染リスクが高いため消毒・抗菌薬投与を考慮する。局所麻酔薬自体の禁忌はないが、アドレナリンは血糖上昇作用があるため注意を要する。"},
{q:"血液透析患者の歯科治療で正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["透析日に治療を行う","透析翌日に治療を行う","出血傾向があるため止血に注意","NSAIDs（非ステロイド性抗炎症薬）を優先使用","ヘパリン効果が残存していないことを確認する"],correct:[1,2,4],exp:"血液透析患者では、透析日はヘパリン使用により出血傾向が高まるため避け、透析翌日に治療を行うのが原則。腎機能低下による血小板機能障害・尿毒症性出血傾向があり止血に注意。NSAIDsは腎障害を悪化させるため原則禁忌。"},
{q:"ワルファリン服用患者の抜歯について正しいのはどれか。1つ選べ。",t:"4択",opts:["必ず服薬を中止してから行う","PT-INR 2.0〜3.0の範囲なら継続したまま抜歯可能","ヘパリン置換が原則","局所麻酔は禁忌"],correct:[1],exp:"ワルファリン服用患者でPT-INRが治療域（2.0〜3.0）であれば、服薬を継続したままでも局所的な止血処置（止血剤・縫合等）を適切に行うことで安全に抜歯できる。安易な中断は血栓塞栓症リスクを高める。血栓塞栓症の既往がある場合はかかりつけ医と相談する。"},
{q:"妊婦への歯科治療で安全な時期はどれか。1つ選べ。",t:"4択",opts:["妊娠初期（1〜3ヶ月）","妊娠中期（4〜7ヶ月）","妊娠後期（8〜10ヶ月）","分娩直前"],correct:[1],exp:"妊婦への侵襲的歯科治療は妊娠中期（4〜7ヶ月：安定期）が最も安全である。初期（器官形成期）は催奇形性リスク、後期は仰臥位低血圧症候群や早産リスクがある。緊急処置以外は安定期に計画的に行う。"},
{q:"心臓ペースメーカー装着患者の歯科治療で注意すべきはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["電気メス（電気外科装置）の使用を避ける","超音波スケーラーの使用を避ける","局所麻酔は絶対禁忌","単極型電気メスの使用は問題ない","パルスオキシメータの使用は禁忌"],correct:[0,1],exp:"ペースメーカー患者では、電磁干渉を起こしうる電気メス（特に単極型）・超音波スケーラーの使用は原則禁忌または慎重使用とする。双極型電気メスは比較的安全だが事前にメーカー確認が必要。局所麻酔は問題なく使用可能。"},
{q:"ビスフォスフォネート製剤服用患者の歯科治療で注意すべき合併症はどれか。1つ選べ。",t:"4択",opts:["歯根吸収","薬剤関連顎骨壊死（MRONJ）","過呼吸症候群","口腔乾燥症のみ"],correct:[1],exp:"ビスフォスフォネート製剤（骨粗鬆症・悪性腫瘍に使用）服用患者への侵襲的歯科治療（抜歯など）後に、薬剤関連顎骨壊死（MRONJ：Medication-Related Osteonecrosis of the Jaw）が発生することがある。処置前後の口腔衛生管理と専門医との連携が重要。"},
{q:"喘息患者の歯科治療で禁忌に近い薬物はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["アスピリン","アセトアミノフェン","NSAIDs（イブプロフェン等）","リドカイン","クロルヘキシジン"],correct:[0,2],exp:"喘息（特にアスピリン喘息）患者ではアスピリン・NSAIDs全般が気管支攣縮を誘発する可能性があり、禁忌または慎重投与。アセトアミノフェンはCOX阻害作用が弱く、比較的安全な解熱鎮痛薬として使用できる。リドカイン・クロルヘキシジンは問題ない。"},
{q:"血友病患者の抜歯で正しいのはどれか。1つ選べ。",t:"4択",opts:["凝固因子補充なしで行う","入院の上、血液内科と連携して凝固因子補充後に行う","局所止血処置のみで対応可能","全身麻酔が必須"],correct:[1],exp:"血友病A（第Ⅷ因子欠乏）・血友病B（第Ⅸ因子欠乏）患者の抜歯は、入院の上で血液内科と連携し、術前に適切な凝固因子製剤の補充を行った後に実施するのが原則。局所止血処置のみでは管理困難な大量出血になる危険がある。"},
// --- 新規追加 7問 ---
{q:"直接抗凝固薬（DOAC：アピキサバン・リバーロキサバン等）服用患者の抜歯について正しいのはどれか。1つ選べ。",t:"4択",opts:["必ず服薬を中止する","PT-INRで管理する","原則として休薬不要（単純抜歯）で局所止血を徹底する","ヘパリン置換が必要"],correct:[2],exp:"DOAC（直接経口抗凝固薬）服用患者の単純抜歯は、原則として休薬せずに局所止血処置（止血剤・縫合・圧迫）を徹底することで対応可能な場合が多い。ワルファリンと異なりPT-INRで管理できないため処方医に相談する。複数抜歯・骨切除等の大手術では休薬を検討する。"},
{q:"副腎皮質ステロイド薬を長期服用している患者の手術時に注意すべき事項はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["副腎クリーゼ（急性副腎不全）のリスク","血糖値の上昇","出血傾向の増大","感染リスクの低下","高カリウム血症"],correct:[0,1],exp:"長期ステロイド服用患者（HPA軸抑制）では、手術侵襲などのストレス時に副腎クリーゼ（ショック・低血圧・意識障害）を起こすリスクがある。また糖新生促進により血糖値が上昇する。感染リスクは免疫抑制で増大し、低カリウム・低カルシウム血症が問題となる。"},
{q:"甲状腺機能亢進症（バセドウ病）患者の歯科麻酔で注意すべき事項はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["アドレナリン含有局所麻酔薬は慎重使用","フェリプレシン含有製剤が第一選択","局所麻酔薬はすべて禁忌","甲状腺クリーゼのリスクがある","アトロピン前投薬が必須"],correct:[0,3],exp:"甲状腺機能亢進症患者では甲状腺ホルモン過剰により交感神経が亢進し、アドレナリンへの感受性が高まっている。そのためアドレナリン含有麻酔薬は頻脈・高血圧・不整脈を誘発しうる。手術侵襲・感染・精神的ストレスにより甲状腺クリーゼ（生命危機状態）が誘発される可能性もある。"},
{q:"肝硬変患者の歯科治療で注意すべき事項はどれか。3つ選べ。",t:"複数選択（3つ）",opts:["出血傾向（凝固因子産生低下）","局所麻酔薬の代謝遅延","感染リスクの増大","腎機能の著しい亢進","血糖の上昇"],correct:[0,1,2],exp:"肝硬変患者では①凝固因子（プロトロンビン・第Ⅶ因子等）の産生低下・血小板減少による出血傾向、②肝臓での局所麻酔薬（アミド型）代謝能低下による中毒リスク増大、③免疫機能低下による感染リスク増大が問題となる。"},
{q:"抗血小板薬（アスピリン・クロピドグレル等）服用患者の抜歯について正しいのはどれか。1つ選べ。",t:"4択",opts:["必ず2週間前から服薬中止","単純抜歯では継続したまま局所止血処置で対応可能","脳梗塞・心筋梗塞の既往があっても必ず中止","ワルファリン同様にPT-INRで管理"],correct:[1],exp:"抗血小板薬服用患者の単純抜歯では、原則として服薬を継続したまま局所止血処置（圧迫・縫合・止血剤）で対応可能なことが多い。安易な中断は血栓塞栓症（脳梗塞・心筋梗塞の再発）リスクを高める。処方医との連携が重要。"},
{q:"MRI検査が禁忌または慎重適応となる患者はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["心臓ペースメーカー装着患者","チタン製インプラント患者","脳動脈クリップ（強磁性体）装着患者","義歯装着患者","骨格矯正用ミニスクリュー装着患者"],correct:[0,2],exp:"MRI禁忌：①心臓ペースメーカー・植込み型除細動器（強磁場による誤作動）、②強磁性体の金属（旧型脳動脈クリップ・一部の外科用クリップ等）は磁場で移動・回転し組織損傷を起こす可能性がある。チタン製インプラントや非磁性金属は一般的にMRI安全性が高い。"},
{q:"全身疾患を有する患者の歯科治療前評価として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["医科主治医からの情報収集（紹介状・情報提供書）","バイタルサインの測定（血圧・脈拍等）","血液検査は一切不要","全身疾患があれば全て全身麻酔が必要","患者の自己申告のみで判断する"],correct:[0,1],exp:"全身疾患を有する患者の術前評価：①内科主治医からの情報収集（疾患の状態・投薬内容・治療上の注意事項）、②来院時のバイタルサイン測定（血圧・脈拍・SpO₂）が基本。必要に応じて血液検査（凝固検査・血糖・肝機能等）も行う。"},
],
m6:[
// --- 既存6問 ---
{q:"慢性疼痛の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["3ヶ月以上持続する痛み","組織損傷が必ず存在する","心理社会的因子が関与する","オピオイドが第一選択","急性疼痛と全く同じ機序"],correct:[0,2],exp:"慢性疼痛は一般に3ヶ月以上持続する痛みで、急性期の組織損傷が治癒しても痛みが遷延する場合が多い。心理社会的因子（不安・抑うつ・生活環境）が疼痛の増悪・維持に大きく関与する。治療は薬物・心理・リハビリテーションの集学的アプローチが必要。"},
{q:"三叉神経痛の特徴として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["電撃様・発作性の激しい疼痛","誘発点（トリガーゾーン）がある","夜間に特に痛みが強い","カルバマゼピンが有効","両側性に発生する"],correct:[0,1,3],exp:"三叉神経痛（真性三叉神経痛）は電撃様・刺すような発作性の激痛が三叉神経支配領域に生じる。誘発点（トリガーゾーン）への触刺激（食事・会話・洗顔等）で発作が誘発される。抗痙攣薬カルバマゼピンが第一選択。通常は片側性。"},
{q:"舌痛症の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["器質的原因が明確","灼熱感・ヒリヒリ感が主症状","睡眠中も痛みが続く","食事中は痛みが増強する","女性の閉経後に多い"],correct:[1,4],exp:"舌痛症（Burning Mouth Syndrome）は舌・口腔粘膜の灼熱感・疼痛が主症状だが器質的原因が不明な機能性疾患である。食事中は症状が軽減・消失することが多く（これが診断の手がかり）、閉経後の中高年女性に多い。睡眠中は通常消失する。"},
{q:"NSAIDsの作用機序はどれか。1つ選べ。",t:"4択",opts:["μオピオイド受容体の刺激","COX（シクロオキシゲナーゼ）の阻害","NMDAグルタミン酸受容体の遮断","GABA受容体の増強"],correct:[1],exp:"NSAIDs（非ステロイド性抗炎症薬）の作用機序はCOX（シクロオキシゲナーゼ）を阻害してプロスタグランジン合成を抑制することである。抗炎症・解熱・鎮痛の三作用をもつ。COX-2選択的阻害薬（セレコキシブ等）は胃粘膜障害が少ない。"},
{q:"口腔顔面痛のうち筋・筋膜性疼痛（MPD）の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["咀嚼筋の圧痛","放散痛がみられる","骨の変形を伴う","顎関節に明確な器質的変化","レントゲンで骨破壊がわかる"],correct:[0,1],exp:"筋・筋膜性疼痛（MPD：Myofascial Pain Dysfunction）では咀嚼筋（特に咬筋・側頭筋）に圧痛点（トリガーポイント）があり、遠隔部への放散痛がみられる。顎関節や骨には器質的変化がない場合が多く、機能的障害が主体である。"},
// --- 新規追加 8問 ---
{q:"WHOの疼痛治療ラダーで正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["第1段階は非オピオイド鎮痛薬（NSAIDs・アセトアミノフェン）","第2段階は強オピオイド（モルヒネ等）","第3段階は弱オピオイド（コデイン等）","補助鎮痛薬は全段階で使用可","強い痛みには最初からオピオイドを使用"],correct:[0,3],exp:"WHO三段階鎮痛ラダー：第1段階=非オピオイド（NSAIDs・アセトアミノフェン）、第2段階=弱オピオイド（コデイン・トラマドール）+第1段階薬、第3段階=強オピオイド（モルヒネ・オキシコドン・フェンタニル）+第1段階薬。補助鎮痛薬（抗うつ薬・抗痙攣薬等）は全段階で使用可能。"},
{q:"顎関節症の病型分類（DC/TMD）として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["関節痛（関節炎）","関節円板転位","変形性顎関節症（骨関節炎）","三叉神経痛","舌痛症"],correct:[0,1,2],exp:"顎関節症（TMD）の国際分類（DC/TMD）では①筋疾患（筋痛・筋筋膜痛等）、②関節疾患（関節痛・関節円板転位・変形性顎関節症〈骨関節炎〉・関節強直等）に大別される。三叉神経痛・舌痛症はTMDとは別の疾患概念である。"},
{q:"アセトアミノフェンの特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["COX阻害による抗炎症作用が強い","解熱・鎮痛作用がある","胃腸障害が少ない","腎機能への影響が大きい","過量服用では肝障害のリスクがある"],correct:[1,2,4],exp:"アセトアミノフェンは解熱・鎮痛作用をもつが、COX阻害による末梢性の抗炎症作用は弱い。NSAIDsと異なり胃腸障害・腎障害が少なく喘息患者にも比較的安全。ただし過量服用（中毒量）では肝障害（肝壊死）のリスクがある。"},
{q:"神経障害性疼痛（neuropathic pain）に有効な薬物はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["プレガバリン（リリカ）","イブプロフェン","三環系抗うつ薬（アミトリプチリン等）","アスピリン","コルヒチン"],correct:[0,2],exp:"神経障害性疼痛（帯状疱疹後神経痛・糖尿病性神経障害・抜歯後神経損傷等）に対しては、①Ca²⁺チャネルα₂δサブユニット阻害薬（プレガバリン・ガバペンチン）、②三環系抗うつ薬（アミトリプチリン等）が有効。NSAIDs（イブプロフェン・アスピリン）は神経障害性疼痛への効果が限定的。"},
{q:"帯状疱疹（ヘルペスゾスター）に関連した口腔顔面領域の疼痛の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["片側性の皮膚分節に沿った疼痛・水疱","抗ウイルス薬（アシクロビル等）が有効","両側性に同時発症する","帯状疱疹後神経痛（PHN）に移行しにくい","抗菌薬が第一選択"],correct:[0,1],exp:"帯状疱疹は水痘帯状疱疹ウイルス（VZV）再活性化によって起こり、片側の皮膚分節に沿った疱疹・強い疼痛を呈する。三叉神経第2〜3枝領域では口腔内・顔面の症状が出る。抗ウイルス薬（アシクロビル・バラシクロビル）が有効。発症後72時間以内の投与が重要。高齢者では帯状疱疹後神経痛（PHN）に移行しやすい。"},
{q:"非定型歯痛（持続性特発性顔面痛）の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["器質的原因が同定できない","歯科治療（抜髄・抜歯）後も疼痛が持続することがある","明確なトリガーゾーンがある","カルバマゼピンで著効する","電撃様・発作性の痛みが特徴"],correct:[0,1],exp:"非定型歯痛（現在は持続性歯槽骨疼痛・持続性特発性顔面痛と呼ばれる）は器質的原因が見当たらないにもかかわらず歯・歯槽骨・顎に持続的な鈍痛・灼熱痛を呈する。抜髄・抜歯後も持続することがあり、不必要な処置の繰り返しを避けることが重要。三叉神経痛とは異なりトリガーゾーンや電撃様疼痛はない。"},
{q:"口腔顔面領域で片側性・拍動性頭痛・悪心・羞明を伴う頭痛疾患はどれか。1つ選べ。",t:"4択",opts:["三叉神経痛","舌痛症","片頭痛（偏頭痛）","群発頭痛"],correct:[2],exp:"片頭痛（偏頭痛）は片側性・拍動性（ズキズキ）頭痛で、悪心・嘔吐・羞明（光過敏）・音過敏を伴い、日常動作で増悪する。発作前に閃輝暗点などの前兆（aura）が見られる場合もある。群発頭痛は目の周囲の激しい一側性頭痛で流涙・鼻汁を伴い、男性に多い。"},
{q:"口腔乾燥症（ドライマウス）をきたす薬物はどれか。3つ選べ。",t:"複数選択（3つ）",opts:["抗コリン薬（アトロピン等）","利尿薬","抗ヒスタミン薬","NSAIDs","βブロッカー"],correct:[0,1,2],exp:"口腔乾燥症（xerostomia）をきたす薬物：①抗コリン薬（アトロピン・三環系抗うつ薬・抗パーキンソン薬）：唾液分泌を抑制。②利尿薬：脱水から口腔乾燥。③抗ヒスタミン薬（H₁拮抗薬）：抗コリン作用で唾液減少。NSAIDs・βブロッカーは比較的影響が少ない。"},
],
m7:[
// --- 既存6問 ---
{q:"BLS（一次救命処置）の手順として正しいのはどれか。1つ選べ。",t:"4択",opts:["気道確保→換気→胸骨圧迫","胸骨圧迫→気道確保→換気","換気→胸骨圧迫→気道確保","AED→胸骨圧迫→気道確保"],correct:[1],exp:"2015年以降のガイドライン（JRC/AHA）では心停止確認後、すぐに胸骨圧迫（C）→気道確保（A）→人工呼吸（B）の順（C-A-B）でBLSを開始する。以前のA-B-Cから変更された。胸骨圧迫を遅延させないことが重要。"},
{q:"AED（自動体外式除細動器）による除細動の適応はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["心室細動（Vf）","無脈性心室頻拍（pulseless VT）","無収縮（asystole）","無脈性電気活動（PEA）","洞性徐脈"],correct:[0,1],exp:"AEDの適応は電気的除細動が有効な心室細動（Vf）と無脈性心室頻拍（pulseless VT）の2つである。無収縮・PEAはshockable rhythmではなくAEDは無効。AED装着後に解析を行い、shockableと判断した場合のみ除細動を実施する。"},
{q:"胸骨圧迫の適切な深さと速さはどれか。1つ選べ。",t:"4択",opts:["2cm・60回/分","4〜5cm・80回/分","5〜6cm・100〜120回/分","8cm・150回/分"],correct:[2],exp:"2015年ガイドラインでは成人の胸骨圧迫は、深さ5〜6cm（少なくとも5cm、6cmを超えない）、速さ100〜120回/分で行う。毎回圧迫後は完全に胸壁を戻すこと。中断を最小限にすることも重要。"},
{q:"救急蘇生法においてAED使用後に直ちに行うのはどれか。1つ選べ。",t:"4択",opts:["脈拍確認","気道確認","胸骨圧迫","人工呼吸"],correct:[2],exp:"AEDによる除細動実施直後は、脈拍確認をせずに直ちに胸骨圧迫を再開する（2分間CPR）。その後AEDによる再解析を行う。除細動後の心拍再開を確認するための脈拍確認で時間を無駄にしないことが重要。"},
{q:"歯科診療室内での救急対応で正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["AEDの設置・使用訓練","患者の体位管理（仰臥位・下肢挙上）","救急カートの常備","重篤時は119番通報","軽い失神は放置でよい"],correct:[0,1,2,3],exp:"歯科診療室では①AEDの設置と定期的な使用訓練、②失神等の際に仰臥位・下肢挙上による体位管理、③救急薬品（エピネフリン・アトロピン等）と器材を入れた救急カート、④重篤な状態が継続する場合は119番通報が必要。"},
{q:"気道異物による窒息に対する処置として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["ハイムリック法（腹部突き上げ法）","背部叩打法","胸骨圧迫法（意識消失時）","強制的に口腔内を指で探る","体位は腹臥位"],correct:[0,1,2],exp:"気道異物（窒息）への対処は①背部叩打法（5回）と②ハイムリック法（腹部突き上げ：5回）を交互に繰り返す。意識消失した場合は胸骨圧迫CPRに移行し、CPR中に異物が見えたときのみ口腔内を確認する（盲目的な指での探索は禁忌）。"},
// --- 新規追加 9問 ---
{q:"成人に対するCPR（心肺蘇生）における胸骨圧迫と人工呼吸の比率として正しいのはどれか。1つ選べ。",t:"4択",opts:["5:1","15:2","30:2","60:2"],correct:[2],exp:"成人CPRにおける胸骨圧迫と人工呼吸の比率は30:2である。30回の胸骨圧迫後に2回の人工呼吸を行うサイクルを繰り返す。ただし気道確保が困難・感染リスクがある場合はハンズオンリーCPR（胸骨圧迫のみ）でも有効とされている。"},
{q:"小児（未就学児）の蘇生で成人と異なる点として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["胸骨圧迫の深さは胸郭前後径の1/3程度","胸骨圧迫の速さは60回/分","最初に2回の人工呼吸から開始（一人のときは5サイクル後に119番）","AEDは小児には使用できない","人差し指1本で胸骨圧迫する"],correct:[0,2],exp:"小児CPRの特徴：①圧迫の深さ（胸郭前後径の約1/3：乳児約4cm・小児約5cm）、②速さは成人同様100〜120回/分、③1人の場合は5サイクルのCPR後に119番通報、④AEDは小児用パッド/モードを使用（なければ成人用でも可）。"},
{q:"自動体外式除細動器（AED）の操作手順として正しいのはどれか。1つ選べ。",t:"4択",opts:["電源ON→電極パッド装着→心電図解析→必要なら除細動","電極パッド装着→電源ON→除細動","電源ON→除細動→心電図解析→電極パッド装着","電源ON→心電図解析→電極パッド装着→除細動"],correct:[0],exp:"AEDの操作手順：①電源ON（フタを開けると自動でONになる機種も）、②音声ガイドに従い電極パッド装着（右鎖骨下・左脇下）、③心電図自動解析、④shockable rhythmなら「ショックが必要です」のアナウンス後に周囲の安全を確認してショックボタン押下、⑤直ちに胸骨圧迫再開。"},
{q:"心肺蘇生（CPR）実施中の正しい対応はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["胸骨圧迫の中断は最小限にする（10秒以内）","AEDの解析中も胸骨圧迫を継続する","1サイクルは30回圧迫+2回換気","呼気吹き込みは5秒かけてゆっくり行う","除細動後は脈拍確認を必ず行ってから圧迫を再開する"],correct:[0,2],exp:"効果的なCPR：①胸骨圧迫の中断は最小限（10秒以内が目安）にする。②1サイクルは30回圧迫+2回換気（30:2）。AEDの解析中は感電防止のため圧迫を止める。呼気吹き込みは1秒かけて行う。除細動後は脈拍確認せずに直ちに圧迫を再開する。"},
{q:"乳児（1歳未満）への気道異物（窒息）の対処として正しいのはどれか。1つ選べ。",t:"4択",opts:["腹部突き上げ法（ハイムリック法）","背部叩打法と胸部突き上げ法を交互に","頭部後屈顎先挙上法","異物が見えたら指で盲目的に除去する"],correct:[1],exp:"乳児（1歳未満）への気道異物対処：腹部臓器損傷のリスクがあるため腹部突き上げ法（ハイムリック法）は禁忌。背部叩打法（5回）と胸部突き上げ法（5回：乳頭連結線の1横指下を指2本で圧迫）を交互に行う。盲目的な口腔内探索は禁忌。"},
{q:"成人の心肺蘇生で使用するAEDの電極パッドの貼付位置として正しいのはどれか。1つ選べ。",t:"4択",opts:["右肩と左肩","右鎖骨下・右胸部と左脇下（腋窩）","右鎖骨下・前胸部と左脇下（腋窩）","腹部と胸部"],correct:[2],exp:"AEDの電極パッドは①右鎖骨下（胸骨の右側）・前胸部と②左脇下（左乳頭外側の腋窩線上）に貼付する。パッド間には電流が流れるため、心臓を挟む位置が重要。前後（前胸・後背）への貼付も可能。"},
{q:"喉頭痙攣（laryngospasm）の対処として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["下顎挙上・陽圧換気","刺激を与えてさらに覚醒させる","サクシニルコリンの投与（重症例）","アドレナリン吸入","胸骨圧迫CPR（直ちに）"],correct:[0,2],exp:"喉頭痙攣（声門の反射性閉鎖）への対処：①軽症：刺激を取り除き、下顎挙上・陽圧酸素投与で多くは改善。②重症（解除できない場合）：サクシニルコリン（超短時間作用型筋弛緩薬）を少量投与して声門を弛緩させる。心停止に至った場合のみCPRを行う。"},
{q:"ACLS（二次救命処置）でVfに対する非薬物療法として正しいのはどれか。1つ選べ。",t:"4択",opts:["胸骨圧迫のみ","除細動（電気的除細動）","人工呼吸のみ","心臓マッサージ（開胸）"],correct:[1],exp:"VF（心室細動）・無脈性VT（心室頻拍）の最も効果的な治療は電気的除細動（除細動器によるショック）である。早期除細動で致死的不整脈を洞調律に戻す。除細動後はCPRを再開し、アドレナリン・アミオダロン等の薬物治療を並行して行う（ACLS）。"},
{q:"アナフィラキシーショックで心停止に至った場合の対応として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["標準的BLS/ACLSを実施する","アドレナリンの大量反復投与が有効","高圧酸素療法（HBO）を行う","ニフェジピンを投与する","AEDは使用しない"],correct:[0,1],exp:"アナフィラキシーショックによる心停止では通常のBLS（胸骨圧迫・AED）を行いながら、アドレナリン（エピネフリン）を積極的に投与する。通常の心停止より大量・反復投与が有効とされる。ACLSの標準プロトコルに従って対処する。"},
],
},
rad:{
r1:[
{q:"電磁放射線はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["電子線","中性子線","ガンマ線","アルファ線","エックス線"],correct:[2,4],exp:"放射線は粒子放射線と電磁放射線に分類される。電磁放射線はガンマ線とエックス線（質量をもたない波動）である。電子線・アルファ線・陽子線・中性子線は粒子放射線に属する。電磁放射線は光子として仮想的粒子を定義することがある。"},
{q:"エックス線管の構成要素として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["陰極（フィラメント）","陽極（ターゲット）","真空管","コンデンサ","変圧器（トランス）"],correct:[0,1,2],exp:"エックス線管（X線管）の主な構成要素は陰極（フィラメント）・陽極（ターゲット）・真空管（ガラス管内を高真空にする）である。陰極から放出された電子が陽極のターゲット（タングステン）に衝突してエックス線が発生する。"},
{q:"エックス線の性質として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["物質を透過する","質量をもつ","蛍光作用がある","光速より遅い","正の電荷をもつ"],correct:[0,2],exp:"エックス線の性質：透過作用（物質を透過する）・電離作用（物質をイオン化）・蛍光作用（蛍光物質を発光させる）・写真作用（フィルムを感光）・生物学的作用がある。電磁波のため質量・電荷なし、光速（約3×10⁸m/s）で伝播する。"},
{q:"歯科用エックス線撮影装置の管電圧（kVp）として一般的なのはどれか。1つ選べ。",t:"4択",opts:["10〜30kVp","60〜70kVp","150〜200kVp","300kVp以上"],correct:[1],exp:"歯科用エックス線装置（口内法・パノラマ等）では通常60〜70kVpの管電圧が用いられる。管電圧が高いほどエックス線のエネルギー（硬さ）が増し、透過力が増大する。低エネルギーのエックス線（軟線）はろ過（フィルタ）で除去される。"},
{q:"TP（イメージングプレート）方式のデジタル撮影の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["フィルムと同程度の撮像範囲が得られる","CCD方式より感度が高い","読み取りにスキャナーが必要","画像が即時に表示される","コードがない（ワイヤレス）"],correct:[0,2,4],exp:"イメージングプレート（IP/TP）方式は、フィルムと同じ撮像範囲が得られ、コードがなく操作性が良い（薄い・軽い）。ただしスキャナーで読み取る必要があるためCCD/CMOS方式より手順が多く、即時表示はできない。感度はCCD/CMOS方式より低い。"},
{q:"パノラマエックス線撮影で描出されないのはどれか。1つ選べ。",t:"4択",opts:["顎関節","副鼻腔","歯周骨","歯髄腔内の詳細","上顎洞"],correct:[3],exp:"パノラマ撮影は顎骨・全歯列・顎関節・上顎洞・副鼻腔を広範囲に観察できる。ただし空間分解能が低く、歯髄腔内の微細構造・小さな根尖病変の詳細は口内法（デンタル撮影）が優れている。"},
{q:"歯科用CTで使用されるのはどれか。1つ選べ。",t:"4択",opts:["CT（医科用）のみ","コーンビームCT（CBCT）","MRI","RI（核医学）"],correct:[1],exp:"歯科領域ではコーンビームCT（CBCT：Cone Beam CT）が広く使用される。医科用CTに比べて被ばく線量が少なく、小型で、高い空間分解能（骨の詳細観察）が得られる。インプラント術前診断・埋伏歯・顎骨病変の評価に有用。"},
{q:"写真（フィルム）画像の鮮鋭度に影響する因子として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["焦点サイズ","被写体の動き","現像液の温度","管電流（mA）","フィルム感度"],correct:[0,1],exp:"エックス線写真の鮮鋭度（シャープネス）に影響する因子：①焦点サイズ（小さいほど鮮明）、②被写体の動き（動くとぼける）、③焦点フィルム間距離・被写体フィルム間距離なども関係する。現像液温度や管電流はコントラスト・濃度に影響する。"},
{q:"X線フィルムの感度（感光性）を上げるのはどれか。1つ選べ。",t:"4択",opts:["増感紙なし","高電圧・長時間照射","増感紙との組み合わせ","現像温度の低下"],correct:[2],exp:"増感紙（蛍光板）とフィルムを組み合わせることでフィルムの感光効率が飛躍的に向上し、被ばく線量を大幅に低減できる。現代のデジタル検出器はさらに感度が高い。増感紙なしのフィルムは直接作用のみで感度が低い。"},
{q:"エックス線のろ過（フィルタリング）の目的として正しいのはどれか。1つ選べ。",t:"4択",opts:["エックス線量を増やす","低エネルギー（軟線）を除去し患者被ばくを低減","コントラストを低下させる","管球の寿命を延ばす"],correct:[1],exp:"ろ過（フィルタリング）は、診断に不要な低エネルギー（長波長）のエックス線（軟線）を除去することで、患者皮膚での無駄な被ばくを低減することが目的。アルミニウム（Al）等の金属フィルタが使用される。これにより平均エネルギーが上昇し、硬いビームになる。"},
{q:"散乱線を減少させる装置はどれか。1つ選べ。",t:"4択",opts:["増感紙","絞り（コリメータ）","グリッド（散乱線除去格子）","回転陽極"],correct:[2],exp:"グリッド（散乱線除去格子）は、患者・被写体から発生した散乱線がフィルム・検出器に達するのを防ぐ格子状の構造物で、コントラストを向上させる。絞り（コリメータ）は照射野を制限して散乱線の発生量を減らす役割をもつ。"},
{q:"歯科撮影で最もよく使われるX線フィルム（デンタルフィルム）のサイズで正しいのはどれか。1つ選べ。",t:"4択",opts:["0号（小児用）","1号（前歯部用）","2号（標準）","4号（パノラマ用）"],correct:[2],exp:"デンタル（口内法）フィルムの標準サイズは2号（3×4cm程度）で成人後臼歯部まで対応できる最も一般的なサイズ。0号・1号は小児・前歯部の小さな口に対応。4号はオクルーザル撮影用の大きなサイズ。"},
{q:"パノラマ撮影の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["断層撮影の一種","口内法より空間分解能が高い","顎骨全体を一枚で観察できる","撮影時間は約1秒","放射線防護は不要"],correct:[0,2],exp:"パノラマ撮影は断層撮影（トモグラフィー）の一種で、焦点域（トモグラフィック・レイヤー）を顎骨に合わせて顎全体を一枚の画像で撮影できる。口内法より空間分解能は低い。撮影時間は装置によるが通常10〜20秒程度。"},
],
r2:[
{q:"エックス線写真の読影で黒く（低濃度に）描出されるのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["エナメル質","歯髄腔","骨皮質","根尖病変（膿瘍）","アマルガム修復体"],correct:[1,3],exp:"エックス線写真では、エックス線を透過しやすい（低吸収）組織は黒く（透過性/radiolucent）描出される。歯髄腔・根尖病変（骨吸収）・軟組織・空気腔が黒い。逆に高吸収のエナメル質・骨皮質・金属修復体は白く（不透過性/radiopaque）描出される。"},
{q:"骨吸収を示すエックス線所見はどれか。1つ選べ。",t:"4択",opts:["骨の白色化（硬化）","骨の黒色化（透過性亢進）","骨梁の増生","骨皮質の肥厚"],correct:[1],exp:"骨吸収（破壊）はエックス線写真で透過性亢進（黒色化）として描出される。これは骨組織が少なくなりエックス線がより多く透過するためである。根尖性歯周炎・歯周病・嚢胞・腫瘍等で骨吸収所見がみられる。"},
{q:"エックス線写真のコントラストを決める因子はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["管電圧（kVp）","管電流（mA）","被写体の組織差（密度・厚み）","撮影時間（秒）","焦点サイズ"],correct:[0,2],exp:"エックス線写真のコントラスト（明暗差）は①管電圧（低いほどコントラスト高）と②被写体の組織の密度差・厚みの差によって決まる。管電流・撮影時間は総照射線量（黒化度・濃度）を決める。焦点サイズは鮮鋭度に影響する。"},
{q:"健常な歯根膜腔のエックス線像はどれか。1つ選べ。",t:"4択",opts:["全く見えない","白い線状の不透過像","黒い線状の透過像","不規則な骨吸収像"],correct:[2],exp:"正常な歯根膜腔はエックス線写真上で黒い線状の透過像（線幅0.15〜0.38mm）として描出される。根尖性歯周炎では歯根膜腔の拡大・骨吸収が起こる。固定ブリッジの支台歯などでは歯根膜腔の幅広化がみられることもある。"},
{q:"歯科エックス線写真の読影で注意すべき生理的変化（正常所見）はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["栄養管（動脈管）","オトガイ孔","歯根吸収","根尖病変","顎骨嚢胞"],correct:[0,1],exp:"エックス線写真上の正常解剖構造（生理的変化）：栄養管（骨内の細い血管・神経の管）はデンタル像でも見られる黒い線状像。オトガイ孔（オトガイ神経が出る孔）は下顎前臼歯根尖付近の円形透過像で、根尖病変と鑑別が必要。"},
{q:"上顎大臼歯のデンタル撮影で重複して描出されやすい構造物はどれか。1つ選べ。",t:"4択",opts:["下顎骨","上顎洞（マクシラリーサイナス）","鼻中隔","軟口蓋"],correct:[1],exp:"上顎大臼歯のデンタル撮影では、上顎洞の底部（洞底）が根尖と重複して描出されることが多い。上顎洞は空気腔のためエックス線透過像（黒い）を示し、根尖の判定に影響することがある。上顎洞底の位置は個人差が大きい。"},
{q:"デンタル撮影で撮影角度の誤りにより起こるのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["歯の伸延（elongation）","歯の短縮（foreshortening）","歯の消失","フィルムの感光不足","管電圧の変化"],correct:[0,1],exp:"デンタル撮影における角度（垂直的）の誤り：角度が少なすぎると歯が伸びて描出（elongation）、多すぎると短縮（foreshortening）して描出される。等分の法則（平行法・等角法）に従った適切な角度設定が必要。"},
{q:"パノラマ撮影でゴースト像（アーティファクト）が生じる原因はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["金属修復物","脊椎（頸椎）","被写体の動き","エックス線管の劣化","照射野の誤設定"],correct:[0,1],exp:"パノラマ撮影のゴースト（幽霊像）は、X線が通過して反対側に形成されるアーティファクトで、金属修復物（補綴物）や頸椎が原因となることが多い。ゴーストは実際の位置より上方かつ左右反転した位置に出現する。"},
],
r3:[
{q:"口内法撮影（デンタル撮影）の種類として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["二等分の法則撮影（等角法）","平行法撮影","咬翼法撮影","頭部規格撮影","セファログラム"],correct:[0,1,2],exp:"口内法撮影には、①二等分の法則（等角法）：歯軸とフィルムの二等分線にX線を照射。②平行法：フィルムを歯軸と平行に置き垂直にX線照射（歯周病診断に有利）。③咬翼法：歯冠部を対象に咬合して撮影し、初期う蝕・歯槽骨頂の評価に適する。"},
{q:"咬翼法撮影が最も適しているのはどれか。1つ選べ。",t:"4択",opts:["埋伏智歯の評価","初期隣接面う蝕の検出","顎骨腫瘍の診断","根尖病変の診断"],correct:[1],exp:"咬翼法（バイトウィング）撮影は上下の臼歯部を同時に撮影できるため、初期隣接面う蝕（コンタクト点下のう蝕）の早期検出と歯槽骨頂の評価（歯周病）に最も適している。"},
{q:"セファログラムの用途として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["矯正治療の顎骨・歯の位置分析","初期う蝕の診断","骨格的問題の評価","根尖病変の診断","歯髄診断"],correct:[0,2],exp:"頭部規格撮影（セファログラム）は一定の条件で頭部側面・正面を撮影し、各計測点（ランドマーク）を用いて骨格・歯の位置関係を分析する。矯正治療の診断・治療計画・治療経過評価・外科的矯正の適応判断に用いられる。"},
{q:"超音波診断装置（エコー）が歯科で使用される用途として正しいのはどれか。1つ選べ。",t:"4択",opts:["骨密度測定","唾液腺・軟組織病変の診断","歯髄の生死判定","根管の長さ測定"],correct:[1],exp:"超音波診断（エコー）は放射線を使用せず、唾液腺腫瘍・リンパ節腫脹・軟組織病変の評価に有用。特に唾液腺結石・腫瘍の鑑別診断に用いられる。根管長測定は電気的根管長測定器（アペックスロケーター）を使用する。"},
{q:"MRI（磁気共鳴画像）の特徴として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["放射線被ばくがない","骨の描出に最も優れる","軟組織の描出に優れる","金属に制限がない","歯科では顎関節の軟組織評価に有用"],correct:[0,2,4],exp:"MRIは磁場と電波（ラジオ波）を使用するため放射線被ばくがなく、軟組織（関節円板・筋肉・神経・腫瘍）の描出に優れる。顎関節の関節円板の形態・転位の評価に有用。骨はCTの方が優れる。ペースメーカー・金属インプラント等は禁忌または制限。"},
{q:"CBCT（コーンビームCT）の長所として正しいのはどれか。3つ選べ。",t:"複数選択（3つ）",opts:["医科用CTより被ばく線量が少ない","3次元（3D）画像が得られる","高空間分解能（骨の詳細）","軟組織のコントラスト分解能が高い","MRIより安価"],correct:[0,1,2],exp:"CBCT（コーンビームCT）の長所：①医科用CTに比べて被ばく線量が大幅に少ない、②3次元画像が得られインプラント・外科計画に活用、③空間分解能が高く骨の微細構造を鮮明に描出。軟組織のコントラスト分解能は医科用CTより低い。"},
{q:"RI（放射性同位元素）を用いた核医学検査（骨シンチグラフィ）の特徴はどれか。1つ選べ。",t:"4択",opts:["骨代謝の高い部位（骨転移・炎症）が描出される","形態的情報が優れる","被ばくがない","歯科では日常的に使用する"],correct:[0],exp:"核医学検査（骨シンチグラフィ）では放射性同位元素（Tc-99m等）を静注し、骨代謝が亢進している部位（骨転移・骨髄炎・顎骨壊死）が集積（ホットスポット）として描出される。機能的情報が得られるが形態的分解能は低い。"},
],
r4:[
{q:"根尖性歯周炎のエックス線所見はどれか。2つ選べ。",t:"複数選択（2つ）",opts:["根尖周囲の透過像（骨吸収）","根尖の硬化","歯根膜腔の拡大","エナメル質の消失","歯冠の破折"],correct:[0,2],exp:"根尖性歯周炎のX線所見：①根尖周囲の透過像（骨吸収による黒色化）、②歯根膜腔の拡大（歯周靱帯の炎症・破壊）。慢性根尖性歯周炎（肉芽腫・嚢胞）では境界明瞭な円形透過像を呈する。急性期は所見が不明瞭なこともある。"},
{q:"歯周病のX線所見として正しいのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["歯槽骨頂の吸収・消失","歯根膜腔の消失","歯石の不透過像（白い）","骨硬化像","エナメル質の肥厚"],correct:[0,2],exp:"歯周病のX線所見：①歯槽骨頂の吸収（水平・垂直的骨吸収）、②歯石（石灰化した歯垢）は不透過像（白い）として見える。骨縁下ポケットの評価には平行法が有用。進行した歯周病では根分岐部病変も描出される。"},
{q:"齲蝕のエックス線診断で最も有効な撮影法はどれか。1つ選べ。",t:"4択",opts:["セファログラム","パノラマ撮影","咬翼法（バイトウィング）","頭部CT"],correct:[2],exp:"隣接面う蝕（プロキシマルカリエス）の早期診断には咬翼法（バイトウィング撮影）が最も有効である。上下の歯冠部を同時に撮影でき、コンタクト点下の初期エナメル質・象牙質の透過像を検出しやすい。"},
{q:"埋伏智歯のX線評価で有用なのはどれか。2つ選べ。",t:"複数選択（2つ）",opts:["パノラマ撮影","CBCT","デンタル撮影（2号）","セファログラム","MRI（通常）"],correct:[0,1],exp:"埋伏智歯（水平埋伏・深部埋伏等）の評価にはパノラマ撮影（全体像・周囲骨との関係）とCBCT（3D評価・下顎管との位置関係）が有用。CBCTは術前の神経走行確認・抜歯リスク評価に不可欠。"},
{q:"歯の内部吸収のX線所見はどれか。1つ選べ。",t:"4択",opts:["歯根外面の吸収","歯髄腔の拡大（球形透過像）","根管の消失","セメント質の肥厚"],correct:[1],exp:"内部吸収（internal resorption）は歯髄内の破歯細胞（クラストサイト）による根管壁内面からの吸収で、X線写真では根管（歯髄腔）が球形〜紡錘形に拡大した透過像として描出される。"},
{q:"下顎の骨格性開咬のセファロ所見として正しいのはどれか。1つ選べ。",t:"4択",opts:["下顎枝の長さが増大","下顎角の減少","GoGn-SN角の増大（ハイアングル）","上顎骨の前方位"],correct:[2],exp:"骨格性開咬では下顎骨が後下方に回転し、GoGn-SN角（下顎平面角）が大きくなる（ハイアングル）。前顔面高が大きく・後顔面高が小さく・下顎枝が短い傾向がある。矯正治療のみでは困難で外科的矯正が必要なケースも多い。"},
{q:"顎関節症のMRI所見として正しいのはどれか。1つ選べ。",t:"4択",opts:["関節円板の前方転位","骨増生像","エナメル質の変化","唾液腺の腫大"],correct:[0],exp:"顎関節症のMRI所見では関節円板の転位（前方転位が最多）が描出される。復位を伴う関節円板前方転位（クリック音）・復位を伴わない転位（クローズドロック）等を診断できる。MRIは軟組織描出に優れ関節円板評価に最適。"},
{q:"骨腫のX線所見として正しいのはどれか。1つ選べ。",t:"4択",opts:["境界不明瞭な透過像","境界明瞭な不透過像（白い）","歯根吸収が著明","内部に歯様構造物"],correct:[1],exp:"骨腫（osteoma）は正常骨組織と同様の成熟骨で構成される良性腫瘍で、X線写真では境界明瞭・均一な不透過像（白い）として描出される。下顎骨体・下顎頭に好発し、ガードナー症候群の一部として多発することもある。"},
],
r5:[

let currentSubject='masui', currentChapter='m1';
let answers={}, scores={};
window.tempSelected={};

function initScores(){
  Object.keys(ALL_QUESTIONS).forEach(s=>{
    scores[s]={};
    Object.keys(ALL_QUESTIONS[s]).forEach(c=>{scores[s][c]={total:0,correct:0};});
  });
}
initScores();

function getChapters(){return currentSubject==='masui'?MASUI_CHAPTERS:RAD_CHAPTERS;}
function getCurrentQuestions(){return ALL_QUESTIONS[currentSubject][currentChapter]||[];}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function selectSubject(s){
  currentSubject=s;
  currentChapter=getChapters()[0].id;
  answers={};window.tempSelected={};
  const masuiQ=Object.values(ALL_QUESTIONS.masui).reduce((a,b)=>a+b.length,0);
  const radQ=Object.values(ALL_QUESTIONS.rad).reduce((a,b)=>a+b.length,0);
  document.getElementById('ch-subject-title').textContent=s==='masui'?'歯科麻酔学':'歯科放射線学';
  document.getElementById('ch-subject-sub').textContent=s==='masui'?`全7チャプター ${masuiQ}問収録`:`全8チャプター ${radQ}問収録`;
  renderChapterGrid();
  showPage('page-chapter');
}

function goToSubject(){showPage('page-subject');}
function goToChapter(){showPage('page-chapter');renderChapterGrid();}

function selectChapter(id){
  currentChapter=id;
  answers={};window.tempSelected={};
  const ch=getChapters().find(c=>c.id===id);
  document.getElementById('quiz-chapter-title').textContent=ch?ch.label:'';
  renderQuiz();
  updateStats();
  showPage('page-quiz');
}

function renderChapterGrid(){
  const chs=getChapters();
  document.getElementById('chapter-grid').innerHTML=chs.map((c,i)=>{
    const sc=scores[currentSubject][c.id];
    const done=sc.total>0;
    const qCount=ALL_QUESTIONS[currentSubject][c.id].length;
    return `<div class="chapter-item${done?' done':''}" onclick="selectChapter('${c.id}')">
      <div class="ch-num">${i+1}</div>
      <div class="ch-info">
        <h3>${c.label}</h3>
        <p>${qCount}問 ${done?'・完了済み ✓':''}</p>
      </div>
      ${done?`<div class="ch-score"><div class="score-num">${sc.correct}/${sc.total}</div><div class="score-label">正解</div></div>`:''}
      <div class="ch-arrow">›</div>
    </div>`;
  }).join('');
}

function updateStats(){
  const qs=getCurrentQuestions();
  const total=Object.keys(answers).length;
  const correct=Object.values(answers).filter(a=>a.correct).length;
  const rate=total===0?0:Math.round(correct/total*100);
  document.getElementById('s-answered').textContent=total;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-rate').textContent=rate+'%';
  document.getElementById('prog').style.width=(qs.length===0?0:Math.round(total/qs.length*100))+'%';
  document.getElementById('prog-text').textContent=total+'/'+qs.length;
}

function checkAnswer(qi,sel){
  const q=getCurrentQuestions()[qi];
  const a=[...sel].sort((a,b)=>a-b), b=[...q.correct].sort((a,b)=>a-b);
  return a.length===b.length&&a.every((v,i)=>v===b[i]);
}

function renderQuiz(){
  const qs=getCurrentQuestions();
  const body=document.getElementById('quiz-body');
  if(!qs.length){body.innerHTML='<p style="padding:1rem">問題がありません</p>';return;}
  body.innerHTML=qs.map((q,qi)=>{
    const ans=answers[qi], submitted=!!ans;
    return `<div class="q-card" id="q${qi}">
      <div class="q-card-head">
        <span class="q-num-badge">問 ${qi+1}</span>
        <span class="q-type-badge">${q.t}</span>
        ${submitted?`<span class="q-status-badge ${ans.correct?'ok':'ng'}">${ans.correct?'✓ 正解':'✗ 不正解'}</span>`:''}
      </div>
      <div class="q-text-area">${q.q}</div>
      <div class="options">
        ${q.opts.map((opt,oi)=>{
          let cls='option';
          if(submitted){
            cls+=' locked';
            if(q.correct.includes(oi))cls+=' correct';
            else if(ans.selected.includes(oi))cls+=' wrong';
          } else {
            const sel=(window.tempSelected[qi])||[];
            if(sel.includes(oi))cls+=' selected';
          }
          return `<div class="${cls}" onclick="toggleOpt(${qi},${oi})">
            <span class="opt-lbl">${String.fromCharCode(65+oi)}</span>
            <span>${opt}</span>
          </div>`;
        }).join('')}
      </div>
      ${!submitted?`<div class="submit-wrap"><button class="submit-btn" id="sbtn${qi}" onclick="submitAnswer(${qi})">解答する</button></div>`:''}
      ${submitted?`<div class="result-box ${ans.correct?'ok-r':'ng-r'}">
        <div class="result-title">${ans.correct?'✓ 正解！':'✗ 不正解'}</div>
        <div class="correct-ans">正答：${q.correct.map(i=>String.fromCharCode(65+i)).join('・')}</div>
        <div class="exp-text">${q.exp}</div>
      </div>`:''}
    </div>`;
  }).join('');

  if(Object.keys(answers).length===qs.length&&qs.length>0){
    const cor=Object.values(answers).filter(a=>a.correct).length;
    body.innerHTML+=`<div class="complete-card">
      <h3>🎉 チャプター完了！</h3>
      <div class="complete-score">${cor}/${qs.length}</div>
      <div class="complete-rate">正解率 ${Math.round(cor/qs.length*100)}%</div>
      <button class="retry-btn" onclick="retryChapter()">🔄 もう一度解く</button>
    </div>`;
  }
}

window.toggleOpt=function(qi,oi){
  if(answers[qi])return;
  if(!window.tempSelected[qi])window.tempSelected[qi]=[];
  const q=getCurrentQuestions()[qi];
  const isMulti=q.t!=='4択';
  const sel=window.tempSelected[qi];
  if(isMulti){const idx=sel.indexOf(oi);if(idx>=0)sel.splice(idx,1);else sel.push(oi);}
  else{window.tempSelected[qi]=[oi];}
  const card=document.getElementById('q'+qi);
  card.querySelectorAll('.option').forEach((el,i)=>{
    el.className='option'+(sel.includes(i)?' selected':'');
    el.onclick=()=>toggleOpt(qi,i);
  });
};

window.submitAnswer=function(qi){
  if(answers[qi])return;
  const sel=window.tempSelected[qi]||[];
  if(!sel.length){alert('選択肢を選んでください');return;}
  const isCorrect=checkAnswer(qi,sel);
  answers[qi]={selected:sel,correct:isCorrect};
  const sc=scores[currentSubject][currentChapter];
  sc.total++;
  if(isCorrect)sc.correct++;
  updateStats();
  const q=getCurrentQuestions()[qi];
  const card=document.getElementById('q'+qi);
  card.querySelectorAll('.option').forEach((el,oi)=>{
    el.className='option locked'+(q.correct.includes(oi)?' correct':(sel.includes(oi)?' wrong':''));
    el.onclick=null;
  });
  const sw=card.querySelector('.submit-wrap');
  if(sw){
    const rb=document.createElement('div');
    rb.className=`result-box ${isCorrect?'ok-r':'ng-r'}`;
    rb.innerHTML=`<div class="result-title">${isCorrect?'✓ 正解！':'✗ 不正解'}</div><div class="correct-ans">正答：${q.correct.map(i=>String.fromCharCode(65+i)).join('・')}</div><div class="exp-text">${q.exp}</div>`;
    sw.replaceWith(rb);
  }
  const head=card.querySelector('.q-card-head');
  const badge=document.createElement('span');
  badge.className=`q-status-badge ${isCorrect?'ok':'ng'}`;
  badge.textContent=isCorrect?'✓ 正解':'✗ 不正解';
  head.appendChild(badge);
  const qs=getCurrentQuestions();
  if(Object.keys(answers).length===qs.length){
    const cor=Object.values(answers).filter(a=>a.correct).length;
    const fin=document.createElement('div');
    fin.className='complete-card';
    fin.innerHTML=`<h3>🎉 チャプター完了！</h3><div class="complete-score">${cor}/${qs.length}</div><div class="complete-rate">正解率 ${Math.round(cor/qs.length*100)}%</div><button class="retry-btn" onclick="retryChapter()">🔄 もう一度解く</button>`;
    document.getElementById('quiz-body').appendChild(fin);
  }
};

window.retryChapter=function(){
  answers={};window.tempSelected={};
  renderQuiz();updateStats();
  document.getElementById('quiz-body').scrollTop=0;
};
</script>
</body>
</html>
